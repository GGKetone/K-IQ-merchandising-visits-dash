<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ketone-IQ · Field Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson.min.js"></script>
<style>
:root {
  --navy:#1e293b;--navy-light:#263548;--navy-border:#334155;
  --accent:#5b8def;--accent-dim:rgba(91,141,239,0.12);
  --bg:#f8fafc;--surface:#ffffff;--surface2:#f1f5fb;
  --text:#1e293b;--text-2:#4b5e78;--text-3:#8096b0;
  --internal:#5b7fa6;--internal-bg:rgba(91,127,166,0.1);
  --skyu:#5ba6a0;--skyu-bg:rgba(91,166,160,0.1);
  --advantage:#a09050;--advantage-bg:rgba(160,144,80,0.1);
  --success:#5a9070;--success-bg:rgba(90,144,112,0.1);
  --warn:#c07878;--warn-bg:rgba(192,120,120,0.1);
  --border:#e2e8f0;
  --shadow-sm:0 1px 3px rgba(0,0,0,0.05),0 1px 2px rgba(0,0,0,0.03);
  --shadow-md:0 4px 12px rgba(0,0,0,0.07),0 2px 4px rgba(0,0,0,0.04);
  --shadow-lg:0 8px 24px rgba(0,0,0,0.09),0 4px 8px rgba(0,0,0,0.05);
  --radius:12px;--radius-sm:8px;
  --sidebar-w:232px;
  --mono:'JetBrains Mono',monospace;
  --sans:'Hanken Grotesk',sans-serif;
  --pos-necktag:#7c6af0;--pos-wobbler:#e07c5a;
  --pos-counter:#5ab0e0;--pos-window:#9878c8;
  --pos-sample:#5bbeaa;--pos-shipper:#c0a030;
  --ease:cubic-bezier(0.16,1,0.3,1);
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;font-family:var(--sans);background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;}
#app{display:flex;height:100vh;overflow:hidden;}

/* SIDEBAR */
#sidebar{width:var(--sidebar-w);min-width:var(--sidebar-w);background:var(--navy);display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden;transition:transform 0.3s var(--ease);z-index:100;}
.sb-brand{padding:22px 18px 18px;border-bottom:1px solid var(--navy-border);}
.sb-logo{display:flex;align-items:center;gap:10px;}
.sb-logo-mark{width:28px;height:28px;background:var(--accent);border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.sb-brand-name{font-size:14px;font-weight:700;letter-spacing:0.02em;color:#fff;}
.sb-brand-sub{font-size:11px;color:rgba(255,255,255,0.4);font-family:var(--mono);margin-top:1px;}
.sb-section{padding:14px 10px 4px;}
.sb-section-label{font-size:10px;font-weight:600;letter-spacing:0.12em;color:rgba(255,255,255,0.3);text-transform:uppercase;padding:0 10px;margin-bottom:6px;}
.sb-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:500;color:rgba(255,255,255,0.6);transition:background 0.15s,color 0.15s;user-select:none;}
.sb-item:hover{background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.9);}
.sb-item.active{background:rgba(91,141,239,0.18);color:#fff;}
.sb-item.active .sb-icon svg{opacity:1;color:var(--accent);}
.sb-icon{width:18px;height:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.sb-icon svg{width:15px;height:15px;opacity:0.55;transition:opacity 0.15s;}
.sb-item:hover .sb-icon svg,.sb-item.active .sb-icon svg{opacity:0.9;}

/* MAIN */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
#topbar{height:54px;min-height:54px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;padding:0 20px;}
#content{flex:1;overflow-y:auto;padding:24px;}
#content>.page{animation:pageIn 0.2s var(--ease);}
@keyframes pageIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

/* HAMBURGER */
#hamburger{display:none;background:none;border:none;cursor:pointer;color:var(--text-2);padding:4px;border-radius:6px;transition:background 0.15s;}
#hamburger:hover{background:var(--surface2);}

/* SEARCH */
#search-wrap{flex:1;max-width:400px;position:relative;}
#search-input{width:100%;padding:7px 12px 7px 36px;border:1.5px solid var(--border);border-radius:8px;font-family:var(--sans);font-size:13px;background:var(--surface2);color:var(--text);outline:none;transition:border-color 0.2s,background 0.2s;}
#search-input:focus{border-color:var(--accent);background:var(--surface);}
#search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text-3);pointer-events:none;}
#search-icon svg{width:14px;height:14px;}
#search-results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius-sm);box-shadow:var(--shadow-lg);max-height:320px;overflow-y:auto;z-index:200;display:none;}
#search-results.open{display:block;}
.sr-item{padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:10px;transition:background 0.12s;}
.sr-item:last-child{border-bottom:none;}
.sr-item:hover{background:var(--surface2);}
.sr-item-body{flex:1;min-width:0;}
.sr-item-title{font-weight:600;font-size:13px;}
.sr-item-sub{font-size:12px;color:var(--text-3);}

/* DATE BAR */
#datebar{display:flex;align-items:center;gap:10px;background:var(--surface);border-bottom:1px solid var(--border);padding:8px 20px;font-size:13px;}
#datebar label{color:var(--text-2);font-weight:500;font-size:12px;}
#datebar input[type="date"]{padding:5px 10px;border:1.5px solid var(--border);border-radius:7px;font-family:var(--sans);font-size:12px;color:var(--text);background:var(--surface2);outline:none;transition:border-color 0.2s;}
#datebar input:focus{border-color:var(--accent);}
#btn-alltime{padding:5px 14px;border:1.5px solid var(--border);border-radius:7px;background:none;font-family:var(--sans);font-size:12px;font-weight:500;color:var(--text-2);cursor:pointer;transition:all 0.15s;}
#btn-alltime:hover{border-color:var(--accent);color:var(--accent);}
.date-range-label{color:var(--text-3);font-size:11px;font-family:var(--mono);}

/* CARDS */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow-sm);transition:box-shadow 0.2s var(--ease),transform 0.2s var(--ease);}
.card-lift:hover{box-shadow:var(--shadow-md);transform:translateY(-1px);}
.card-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-3);margin-bottom:6px;}
.card-value{font-size:28px;font-weight:700;font-family:var(--mono);color:var(--text);line-height:1;}
.card-sub{font-size:11px;color:var(--text-3);margin-top:4px;}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
.grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;}
.grid-6{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;}
.hero-stat{text-align:center;cursor:default;}
.hero-stat .card-value{font-size:34px;}

/* POS CARDS */
.pos-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow-sm);border-top:3px solid var(--pos-c);cursor:pointer;transition:box-shadow 0.2s var(--ease),transform 0.2s var(--ease);}
.pos-card:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px);}
.pos-card .card-value{font-size:24px;color:var(--pos-c);}
.pos-card .card-label{color:var(--pos-c);opacity:0.9;}
.pos-necktag{--pos-c:var(--pos-necktag);}
.pos-wobbler{--pos-c:var(--pos-wobbler);}
.pos-counter{--pos-c:var(--pos-counter);}
.pos-window{--pos-c:var(--pos-window);}
.pos-sample{--pos-c:var(--pos-sample);}
.pos-shipper{--pos-c:var(--pos-shipper);}

/* SECTION */
.section-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.section-title{font-size:15px;font-weight:700;}
.section-sub{font-size:12px;color:var(--text-3);}
.section-gap{margin-top:28px;}

/* BADGES */
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600;font-family:var(--mono);}
.badge-internal{background:var(--internal-bg);color:var(--internal);}
.badge-skyu{background:var(--skyu-bg);color:var(--skyu);}
.badge-advantage{background:var(--advantage-bg);color:var(--advantage);}
.badge-new{background:var(--success-bg);color:var(--success);}
.badge-existing{background:var(--surface2);color:var(--text-3);}
.badge-flagged{background:var(--warn-bg);color:var(--warn);}
.badge-done{background:var(--success-bg);color:var(--success);}

/* POS TAGS */
.pos-tag{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600;}
.pos-tag svg{width:10px;height:10px;}
.pos-tag-necktag{background:rgba(124,106,240,0.1);color:var(--pos-necktag);}
.pos-tag-wobbler{background:rgba(224,124,90,0.1);color:var(--pos-wobbler);}
.pos-tag-counter{background:rgba(90,176,224,0.1);color:var(--pos-counter);}
.pos-tag-window{background:rgba(152,120,200,0.1);color:var(--pos-window);}
.pos-tag-sample{background:rgba(91,190,170,0.1);color:var(--pos-sample);}
.pos-tag-shipper{background:rgba(192,160,48,0.1);color:var(--pos-shipper);}

/* TABS */
.tab-bar{display:flex;gap:2px;border-bottom:2px solid var(--border);margin-bottom:20px;}
.tab-btn{padding:9px 16px;font-size:13px;font-weight:600;color:var(--text-3);background:none;border:none;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:color 0.15s,border-color 0.15s;font-family:var(--sans);}
.tab-btn:hover{color:var(--text-2);}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent);}
.tab-pane{display:none;}
.tab-pane.active{display:block;animation:fadeIn 0.15s ease;}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}

/* ACTION CARDS */
.action-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;cursor:pointer;transition:box-shadow 0.2s var(--ease),transform 0.2s var(--ease);box-shadow:var(--shadow-sm);}
.action-card:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px);}
.action-icon{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;margin-bottom:10px;}
.action-icon svg{width:18px;height:18px;}
.action-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.07em;color:var(--text-3);margin-bottom:4px;}
.action-count{font-size:28px;font-weight:700;font-family:var(--mono);}
.ac-oos .action-icon{background:var(--warn-bg);color:var(--warn);}
.ac-oos .action-count{color:var(--warn);}
.ac-low .action-icon{background:rgba(192,144,64,0.1);color:#c09040;}
.ac-low .action-count{color:#c09040;}
.ac-reorder .action-icon{background:var(--accent-dim);color:var(--accent);}
.ac-reorder .action-count{color:var(--accent);}
.ac-other .action-icon{background:var(--skyu-bg);color:var(--skyu);}
.ac-other .action-count{color:var(--skyu);}

/* STREAM */
.stream-item{display:flex;align-items:flex-start;gap:12px;padding:11px 0;border-bottom:1px solid var(--border);}
.stream-item:last-child{border-bottom:none;}
.stream-dot{width:7px;height:7px;border-radius:50%;margin-top:6px;flex-shrink:0;}
.stream-dot-internal{background:var(--internal);}
.stream-dot-skyu{background:var(--skyu);}
.stream-dot-advantage{background:var(--advantage);}
.stream-body{flex:1;min-width:0;}
.stream-title{font-weight:600;font-size:13px;}
.stream-note{font-size:12px;color:var(--text-2);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.stream-meta{font-size:11px;color:var(--text-3);font-family:var(--mono);margin-top:2px;}

/* LISTS */
.list-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-sm);}
.list-item{display:flex;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:background 0.12s;}
.list-item:last-child{border-bottom:none;}
.list-item:hover{background:var(--surface2);}
.list-item-main{flex:1;min-width:0;}
.list-item-title{font-weight:600;font-size:13px;}
.list-item-sub{font-size:12px;color:var(--text-3);margin-top:1px;}
.list-item-right{text-align:right;flex-shrink:0;}
.list-count{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--accent);}
.list-date{font-family:var(--mono);font-size:11px;color:var(--text-3);}
.list-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.list-icon svg{width:15px;height:15px;}

/* DETAIL */
.detail-hd{margin-bottom:24px;}
.back-btn{display:inline-flex;align-items:center;gap:7px;padding:7px 16px;border-radius:99px;background:var(--accent);color:#fff;font-size:13px;font-weight:600;cursor:pointer;border:none;font-family:var(--sans);box-shadow:0 2px 8px rgba(91,141,239,0.25);transition:background 0.15s,box-shadow 0.15s,transform 0.15s;margin-bottom:16px;}
.back-btn:hover{background:#4a7de0;box-shadow:0 4px 14px rgba(91,141,239,0.35);transform:translateY(-1px);}
.back-btn svg{width:14px;height:14px;}
.detail-title{font-size:22px;font-weight:700;}
.detail-sub{font-size:13px;color:var(--text-3);margin-top:4px;}

/* VISIT CARDS */
.visit-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;margin-bottom:12px;box-shadow:var(--shadow-sm);transition:box-shadow 0.2s;}
.visit-card:hover{box-shadow:var(--shadow-md);}
.visit-card.flagged{border-left:3px solid var(--warn);}
.visit-hd{display:flex;align-items:flex-start;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
.visit-date{font-family:var(--mono);font-size:12px;color:var(--text-3);margin-top:3px;}
.visit-note{font-size:13px;color:var(--text-2);margin-top:8px;line-height:1.6;}
.visit-meta{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px;font-size:12px;color:var(--text-3);}
.visit-photos{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;}
.visit-photo{width:160px;height:120px;object-fit:contain;background:var(--surface2);border-radius:6px;border:1px solid var(--border);cursor:pointer;transition:transform 0.15s;}
.visit-photo:hover{transform:scale(1.03);}
.visit-photo-lg{width:100%;max-width:420px;height:auto;object-fit:contain;background:var(--surface2);border-radius:8px;border:1px solid var(--border);cursor:pointer;transition:transform 0.15s;}
.visit-photo-lg:hover{transform:scale(1.02);}
.adv-photo{width:220px;height:165px;object-fit:contain;background:var(--surface2);border-radius:8px;border:1px solid var(--border);cursor:pointer;transition:transform 0.15s;}.adv-photo:hover{transform:scale(1.02);}

/* PROGRESS */
.prog-wrap{height:4px;background:var(--border);border-radius:2px;overflow:hidden;}
.prog-fill{height:100%;border-radius:2px;background:var(--accent);transition:width 0.5s var(--ease);}

/* BAR LIST */
.bar-list-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);cursor:pointer;transition:opacity 0.12s;}
.bar-list-item:last-child{border-bottom:none;}
.bar-list-item:hover{opacity:0.75;}
.bar-list-name{width:160px;font-size:13px;font-weight:500;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bar-list-bar{flex:1;height:5px;background:var(--border);border-radius:3px;overflow:hidden;}
.bar-list-fill{height:100%;border-radius:3px;background:var(--accent);}
.bar-list-count{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--accent);width:36px;text-align:right;flex-shrink:0;}

/* MAP */
#map-container{position:relative;}
#us-map{display:block;}
.state-tooltip{position:absolute;background:var(--navy);color:#fff;padding:6px 10px;border-radius:6px;font-size:12px;pointer-events:none;display:none;z-index:10;box-shadow:var(--shadow-md);}

/* CAMPAIGN CARDS */
.campaign-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow-sm);transition:box-shadow 0.2s var(--ease),transform 0.2s var(--ease);cursor:pointer;margin-bottom:12px;}
.campaign-card:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px);}
.cc-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.cc-date{font-size:16px;font-weight:700;font-family:var(--mono);}
.cc-pct{font-size:22px;font-weight:700;color:var(--accent);font-family:var(--mono);}
.cc-meta{display:flex;gap:16px;font-size:12px;color:var(--text-3);flex-wrap:wrap;}
.cc-meta strong{color:var(--text);font-family:var(--mono);}
.cc-pos-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:10px;}
.cc-pos-item{display:flex;align-items:center;gap:6px;font-size:12px;}
.cc-pos-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.cc-pos-label{color:var(--text-3);}
.cc-pos-val{font-family:var(--mono);font-weight:600;color:var(--text);margin-left:auto;}

/* ISSUE CARDS */
.issue-card{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--warn);border-radius:var(--radius-sm);padding:14px 16px;margin-bottom:10px;cursor:pointer;transition:box-shadow 0.15s;box-shadow:var(--shadow-sm);}
.issue-card:hover{box-shadow:var(--shadow-md);}
.issue-hd{display:flex;align-items:flex-start;gap:8px;flex-wrap:wrap;margin-bottom:6px;}
.issue-note{font-size:13px;color:var(--text-2);line-height:1.5;}
.issue-meta{font-family:var(--mono);font-size:11px;color:var(--text-3);margin-top:6px;}

/* FILTER CHIPS */
.filter-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
.filter-chip{padding:5px 14px;border-radius:99px;border:1.5px solid var(--border);font-size:12px;font-weight:500;cursor:pointer;background:var(--surface);color:var(--text-2);transition:all 0.15s;}
.filter-chip:hover{border-color:var(--accent);color:var(--accent);}
.filter-chip.active{background:var(--accent);border-color:var(--accent);color:#fff;}

/* SOURCE TAGS */
.source-tag{font-size:10px;font-weight:700;font-family:var(--mono);padding:2px 7px;border-radius:4px;text-transform:uppercase;letter-spacing:0.04em;}
.source-tag-internal{background:var(--internal-bg);color:var(--internal);}
.source-tag-skyu{background:var(--skyu-bg);color:var(--skyu);}
.source-tag-advantage{background:var(--advantage-bg);color:var(--advantage);}

/* RETAILER TABLE */
.r-table{width:100%;border-collapse:collapse;font-size:12px;}
.r-table th{text-align:left;padding:8px 12px;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-3);border-bottom:2px solid var(--border);}
.r-table td{padding:9px 12px;border-bottom:1px solid var(--border);}
.r-table tr:last-child td{border-bottom:none;}
.r-table tbody tr{cursor:pointer;transition:background 0.12s;}
.r-table tbody tr:hover td{background:var(--surface2);}
.r-table .rname{font-weight:600;font-size:13px;}
.r-table .num{text-align:right;font-family:var(--mono);font-weight:600;}

/* CONFIG */
.config-field{margin-bottom:16px;}
.config-label{font-size:12px;font-weight:600;color:var(--text-2);margin-bottom:6px;display:block;}
.config-input{width:100%;padding:8px 12px;border:1.5px solid var(--border);border-radius:8px;font-family:var(--mono);font-size:13px;color:var(--text);background:var(--surface2);outline:none;transition:border-color 0.15s;}
.config-input:focus{border-color:var(--accent);}
.btn-primary{padding:9px 22px;border-radius:8px;background:var(--accent);color:#fff;border:none;font-family:var(--sans);font-size:13px;font-weight:600;cursor:pointer;transition:background 0.15s,box-shadow 0.15s;}
.btn-primary:hover{background:#4a7de0;box-shadow:0 4px 12px rgba(91,141,239,0.3);}

/* MODAL */
#modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,0.5);display:none;align-items:center;justify-content:center;z-index:1000;backdrop-filter:blur(4px);}
#modal-overlay.open{display:flex;}
.modal{background:var(--surface);border-radius:14px;padding:28px;width:360px;box-shadow:var(--shadow-lg);animation:modalIn 0.2s var(--ease);}
@keyframes modalIn{from{opacity:0;transform:scale(0.95);}to{opacity:1;transform:scale(1);}}
.modal-title{font-size:17px;font-weight:700;margin-bottom:6px;}
.modal-sub{font-size:13px;color:var(--text-3);margin-bottom:20px;}
.modal-input{width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:8px;font-family:var(--sans);font-size:14px;margin-bottom:12px;outline:none;background:var(--surface2);transition:border-color 0.15s;}
.modal-input:focus{border-color:var(--accent);}
.modal-error{color:var(--warn);font-size:12px;margin-bottom:10px;}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;}
.btn-ghost{padding:7px 16px;border-radius:8px;background:none;border:1.5px solid var(--border);font-family:var(--sans);font-size:13px;font-weight:500;cursor:pointer;color:var(--text-2);transition:all 0.15s;}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent);}

/* PAGINATION */
.pagination{display:flex;align-items:center;gap:6px;margin-top:16px;justify-content:center;}
.page-btn{padding:6px 11px;border:1.5px solid var(--border);border-radius:7px;background:none;font-family:var(--sans);font-size:12px;cursor:pointer;color:var(--text-2);transition:all 0.12s;min-width:34px;text-align:center;}
.page-btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent);}
.page-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.page-btn:disabled{opacity:0.35;cursor:not-allowed;}

/* EMPTY */
.empty{text-align:center;padding:48px 20px;color:var(--text-3);}
.empty-icon{margin-bottom:12px;opacity:0.4;}
.empty-icon svg{width:32px;height:32px;}
.empty-text{font-size:14px;}

/* LOADING */
#loading{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity 0.3s;}
.spinner{width:34px;height:34px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.65s linear infinite;margin-bottom:16px;}
@keyframes spin{to{transform:rotate(360deg);}}
.load-text{font-size:12px;color:var(--text-3);font-family:var(--mono);}

/* MISC */
.store-photos{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;}
#overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.3);z-index:99;}
#overlay.open{display:block;}
.link{color:var(--accent);text-decoration:none;font-size:12px;}
.link:hover{text-decoration:underline;}
a{color:var(--accent);}
.text-mono{font-family:var(--mono);}
.text-sm{font-size:12px;}
.text-muted{color:var(--text-3);}
.divider{height:1px;background:var(--border);margin:18px 0;}

/* POS DRILL HEADER */
.pos-drill-hd{display:flex;align-items:center;gap:14px;margin-bottom:4px;}
.pos-drill-icon{width:44px;height:44px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.pos-drill-icon svg{width:20px;height:20px;}
.pos-drill-title{font-size:21px;font-weight:700;}
.pos-drill-total{font-size:30px;font-weight:700;font-family:var(--mono);margin-left:auto;}

@media(max-width:768px){
  :root{--sidebar-w:244px;}
  #sidebar{position:fixed;top:0;left:0;height:100vh;transform:translateX(-100%);}
  #sidebar.open{transform:translateX(0);box-shadow:var(--shadow-lg);}
  #hamburger{display:flex;}
  .grid-4,.grid-6{grid-template-columns:repeat(2,1fr);}
  .grid-3{grid-template-columns:repeat(2,1fr);}
  .grid-2{grid-template-columns:1fr;}
  #content{padding:16px;}
  .bar-list-name{width:120px;}
}
@media(max-width:480px){.grid-4,.grid-3,.grid-6{grid-template-columns:repeat(2,1fr);}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}

/* LIGHTBOX */
#lightbox{position:fixed;inset:0;background:rgba(15,23,42,0.85);display:none;align-items:center;justify-content:center;z-index:2000;backdrop-filter:blur(6px);cursor:pointer;}
#lightbox.open{display:flex;}
#lightbox img{max-width:90vw;max-height:85vh;object-fit:contain;border-radius:10px;box-shadow:0 12px 40px rgba(0,0,0,0.4);cursor:default;}
#lightbox-close{position:fixed;top:16px;right:20px;background:rgba(255,255,255,0.15);border:none;color:#fff;width:40px;height:40px;border-radius:50%;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background 0.15s;z-index:2001;}
#lightbox-close:hover{background:rgba(255,255,255,0.3);}
#lightbox-hint{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,0.5);font-size:12px;font-family:var(--mono);z-index:2001;}
</style>
</head>

<div id="app">
  <nav id="sidebar">

        <input type="text" id="search-input" placeholder="Search stores, cities, retailers, notes…" oninput="doSearch(this.value)" onblur="setTimeout(()=>closeSearch(),150)">

<script>
'use strict';
const CONFIG={sheetId:'15hEIIX9oeOheBH24DUm07xFSAsm3uHstRqq3KirY1bU',tabs:{internal:'Internal Team',skyu:'SkyU Visits',advStores:'Advantage - Store Visits',advSummary:'Advantage - Campaign Summaries'}};
const state={data:{internal:[],skyu:[],advStores:[],advSummary:[]},dateFrom:null,dateTo:null,currentPage:'dashboard',currentParams:null,configUnlocked:false,history:[],issueFilter:null};

// DATA
function sheetUrl(tab){return'https://docs.google.com/spreadsheets/d/'+CONFIG.sheetId+'/gviz/tq?tqx=out:csv&sheet='+encodeURIComponent(tab);}
function parseCSV(text){
  const rows=[];let row=[],cell='',inQ=false;
  for(let i=0;i<text.length;i++){const c=text[i];if(inQ){if(c==='"'&&text[i+1]==='"'){cell+='"';i++;}else if(c==='"'){inQ=false;}else{cell+=c;}}else{if(c==='"'){inQ=true;}else if(c===','){row.push(cell);cell='';}else if(c==='\n'||(c==='\r'&&text[i+1]==='\n')){row.push(cell);rows.push(row);row=[];cell='';if(c==='\r')i++;}else if(c==='\r'){row.push(cell);rows.push(row);row=[];cell='';}else{cell+=c;}}}
  if(cell||row.length){row.push(cell);rows.push(row);}
  if(!rows.length)return[];
  const headers=rows[0].map(h=>h.trim());
  return rows.slice(1).filter(r=>r.some(c=>c.trim())).map(r=>{const obj={};headers.forEach((h,i)=>{obj[h]=(r[i]||'').trim();});return obj;});
}
async function fetchSheet(tab){const res=await fetch(sheetUrl(tab));return parseCSV(await res.text());}
async function loadAllData(){
  const[a,b,c,d]=await Promise.all([fetchSheet(CONFIG.tabs.internal),fetchSheet(CONFIG.tabs.skyu),fetchSheet(CONFIG.tabs.advStores),fetchSheet(CONFIG.tabs.advSummary)]);
  state.data.internal=a;state.data.skyu=b;
  state.data.advStores=dedupeAdvStores(c);state.data.advSummary=d;
}
function dedupeAdvStores(rows){const seen=new Set();return rows.filter(r=>{const k=r['Chain']+'|'+r['Store #']+'|'+r['Visit Date']+'|'+r['Recap Date'];if(seen.has(k))return false;seen.add(k);return true;});}

// DATES
function parseDate(s){if(!s)return null;const d=new Date(s);return isNaN(d)?null:d;}
function fmtDate(d){if(!d)return'';return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});}
function fmtShort(s){const d=parseDate(s);if(!d)return s||'';return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});}
function inRange(s){if(!state.dateFrom&&!state.dateTo)return true;const d=parseDate(s);if(!d)return false;if(state.dateFrom&&d<state.dateFrom)return false;if(state.dateTo&&d>state.dateTo)return false;return true;}
function applyDates(){state.dateFrom=document.getElementById('date-from').value?new Date(document.getElementById('date-from').value+'T00:00:00'):null;state.dateTo=document.getElementById('date-to').value?new Date(document.getElementById('date-to').value+'T23:59:59'):null;updateDateLabel();render();}
function resetDates(){state.dateFrom=null;state.dateTo=null;document.getElementById('date-from').value='';document.getElementById('date-to').value='';updateDateLabel();render();}
function updateDateLabel(){const el=document.getElementById('date-range-label');el.textContent=(state.dateFrom||state.dateTo)?((state.dateFrom?fmtDate(state.dateFrom):'All')+' – '+(state.dateTo?fmtDate(state.dateTo):'Now')):'All time';}
function fi(){return state.data.internal.filter(r=>inRange(r['Timestamp']));}
function fs(){return state.data.skyu.filter(r=>inRange(r['Email Date']));}
function fa(){return state.data.advStores.filter(r=>inRange(r['Visit Date']));}
// Normalizes a "Recap Date" style field so that two different-but-equivalent
// spellings of the same date (e.g. "5/11" vs "05/11/2025") are treated as the
// same recap when joining the two Advantage tabs together.
function normRecap(s){
  if(!s)return'';
  const d=parseDate(s);
  if(d)return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
  return String(s).trim().toLowerCase();
}
function fsum(){
  // Filter Advantage summaries by date range using Recap Date field
  if(!state.dateFrom && !state.dateTo) return state.data.advSummary;
  return state.data.advSummary.filter(s=>{
    // Recap Date is like "5/11" or "6/11" — we try to match against visit dates
    // from the store rows for that recap, using the actual visit dates for precision.
    // If any store visit in that recap falls in range, include the summary.
    const key=normRecap(s['Recap Date']);
    const recapStores = state.data.advStores.filter(r=>normRecap(r['Recap Date'])===key);
    if(recapStores.length===0) return true; // no store rows, always include summary
    return recapStores.some(r=>inRange(r['Visit Date']));
  });
}

// POS
const POS_TYPES=['Neck Tag','Wobbler','Counter Rack','Window Cling','Sample','Floor Shipper'];
const POS_COLORS={'Neck Tag':'var(--pos-necktag)','Wobbler':'var(--pos-wobbler)','Counter Rack':'var(--pos-counter)','Window Cling':'var(--pos-window)','Sample':'var(--pos-sample)','Floor Shipper':'var(--pos-shipper)'};
const POS_CLASS={'Neck Tag':'pos-necktag','Wobbler':'pos-wobbler','Counter Rack':'pos-counter','Window Cling':'pos-window','Sample':'pos-sample','Floor Shipper':'pos-shipper'};

function getPOS(r){
  const all=((r['Point of Sale Placed']||'')+(r['Displays sold in']||'')+(r['Whether you brought in any point-of-sale materials']||'')).toLowerCase()+' '+(()=>{const k=Object.keys(r).find(k=>k.includes('Next steps'));return k?(r[k]||'').toLowerCase():''})();
  const t=[];
  if(all.includes('neck hanger')||all.includes('neck tag')||all.includes('necktag'))t.push('Neck Tag');
  if(all.includes('wobbler'))t.push('Wobbler');
  if(all.includes('counter rack'))t.push('Counter Rack');
  if(all.includes('window cling'))t.push('Window Cling');
  if(all.includes('sample'))t.push('Sample');
  if(all.includes('floor shipper')||all.includes(' shipper'))t.push('Floor Shipper');
  return t;
}

function calcPOS(rows){
  const c={};POS_TYPES.forEach(t=>c[t]=0);
  rows.forEach(r=>getPOS(r).forEach(t=>c[t]++));
  return c;
}

function totalPOSAll(){
  const intRows=fi(),advSum=fsum();
  const pos=calcPOS(intRows);
  let total=Object.values(pos).reduce((a,b)=>a+b,0);
  advSum.forEach(s=>{total+=(parseInt(s['Neck Tags Placed (Non-HT)'])||0)+(parseInt(s['Neck Tags Placed (HT)'])||0)+(parseInt(s['Wobblers Placed (Non-HT)'])||0)+(parseInt(s['Wobblers Placed (HT)'])||0);});
  return total;
}

function getRetailer(r){
  // Prefer Account serviced, but reject form artifacts like "yes"/"no"/blanks
  const JUNK=/^(yes|no|n\/a|na|none|\-|\.|true|false)$/i;
  const acct=(r['Account serviced']||'').trim();
  const city=(r['Store Location (City)']||'').trim();
  let n=(!acct||JUNK.test(acct))?city:acct;
  if(!n||JUNK.test(n))n='Unknown';
  if(/sprouts/i.test(n))return'Sprouts';if(/circle\s*k/i.test(n))return'Circle K';
  if(/target/i.test(n))return'Target';if(/vitamin\s*shoppe?/i.test(n))return'Vitamin Shoppe';
  if(/bristol\s*farms/i.test(n))return'Bristol Farms';if(/gelson/i.test(n))return"Gelson's";
  if(/7[\-\s]?eleven/i.test(n))return'7-Eleven';if(/ampm/i.test(n))return'AMPM';
  if(/crossfit/i.test(n))return'CrossFit';
  if(/michael\s*kors/i.test(n))return'Michael Kors';
  if(/liquor/i.test(n))return'Liquor Store';
  return n;
}

function cleanLoc(r){
  const JUNK=/^(yes|no|n\/a|na|none|\-|\.|true|false|\d+)$/i;
  const city=(r['Store Location (City)']||'').trim();
  const acct=(r['Account serviced']||'').trim();
  if(!city||JUNK.test(city)){
    if(acct&&!JUNK.test(acct))return acct;
    return'Unlabeled';
  }
  return city;
}

function calcRetailerPOS(rows){
  const map={};
  rows.forEach(r=>{const name=getRetailer(r);if(!map[name])map[name]={visits:0,rows:[],'Neck Tag':0,'Wobbler':0,'Counter Rack':0,'Window Cling':0,'Sample':0,'Floor Shipper':0};map[name].visits++;map[name].rows.push(r);getPOS(r).forEach(t=>map[name][t]++);});
  return Object.entries(map).sort((a,b)=>b[1].visits-a[1].visits);
}

// ISSUES — all three sources
const ISSUE_CATS=[
  {key:'oos',label:'Out of Stock',patterns:['out of stock','oos'],color:'var(--warn)'},
  {key:'low',label:'Low Inventory',patterns:['no inventory','low inventory','no backstock','no back stock'],color:'#c09040'},
  {key:'reorder',label:'Reorder Requests',patterns:['reorder','order placed','placing an order'],color:'var(--accent)'},
  {key:'other',label:'Other Findings',patterns:['no pricing','missing','price tag','not authorized','shelving'],color:'var(--skyu)'}
];
// Notes that merely *mention* an issue word while actually saying there is NO
// problem (e.g. "no inventory issues", "nothing missing") should not be
// flagged. This is a lightweight guard, not full NLP — it catches the common
// negation phrasing seen in these field notes.
const ISSUE_NEGATIONS=['no issues','no problems','nothing missing','all good','fully stocked','no concerns','n/a'];
function catIssue(note){
  if(!note)return null;
  const lc=note.toLowerCase();
  if(ISSUE_NEGATIONS.some(p=>lc.includes(p)))return null;
  for(const c of ISSUE_CATS){if(c.patterns.some(p=>lc.includes(p)))return c.key;}
  return null;
}
function isFlagged(note){return catIssue(note)!==null;}

function getAllIssues(){
  const issues=[];
  for(const r of fi()){const k=Object.keys(r).find(k=>k.includes('Next steps'));const note=k?r[k]:'';const cat=catIssue(note);if(cat)issues.push({source:'internal',note,cat,store:r['Store Location (City)']||'Unlabeled',account:r['Account serviced']||'',date:r['Timestamp']});}
  for(const r of fs()){const note=r['Comments / Findings']||'';const cat=catIssue(note);if(cat)issues.push({source:'skyu',note,cat,store:skyuCity(r),account:'Circle K',date:r['Email Date']});}
  // Advantage outcomes
  for(const s of fsum()){
    const oos=parseInt(s['OOS'])||0;const nr=parseInt(s['Did Not Receive'])||0;
    if(oos>0)issues.push({source:'advantage',note:oos+' stores out of stock in recap '+s['Recap Date'],cat:'oos',store:'Advantage Recap '+s['Recap Date'],account:'Advantage',date:''});
    if(nr>0)issues.push({source:'advantage',note:nr+' stores did not receive materials in recap '+s['Recap Date'],cat:'low',store:'Advantage Recap '+s['Recap Date'],account:'Advantage',date:''});
  }
  return issues;
}

function skyuCity(r){const m=(r['Source Email Subject']||'').match(/Circle K @ (.+?) task/);return m?m[1].trim():(r['Store']||'Unlabeled');}
function driveThumb(url){if(!url)return null;const m=url.match(/[-\w]{25,}/);if(!m)return null;return'https://drive.google.com/thumbnail?id='+m[0]+'&sz=w800';}
function dLinks(str){if(!str)return[];return str.split(',').map(s=>s.trim()).filter(Boolean).map(driveThumb).filter(Boolean);}
function advPhotos(str){
  if(!str)return[];
  const urls=str.split('|').map(s=>s.trim()).filter(Boolean);
  return urls.map(u=>{
    if(u.includes('thumbnail'))return u;
    const m=u.match(/[-\w]{25,}/);
    if(m)return'https://drive.google.com/thumbnail?id='+m[0]+'&sz=w800';
    return u;
  });
}

// POS DETAIL — unified execution view, all sources combined
function renderPOSDetail(params){
  const type=params.type||'Neck Tag';
  const color=POS_COLORS[type]||'var(--accent)';
  const intRows=fi(),advSum=fsum();
  const intMatches=intRows.filter(r=>getPOS(r).includes(type));
  const isNT=type==='Neck Tag',isWB=type==='Wobbler';

  // Advantage placement totals for this type come from the campaign-summary
  // tab, which is the only place that actually records how many of this POS
  // type were placed. The per-store Advantage tab does NOT indicate which
  // specific POS type went into which specific store, so we must not treat
  // "every store visited during a campaign that placed some neck tags" as a
  // Neck Tag "record" — that would inflate/misrepresent the count. Instead,
  // Advantage is represented here at the recap (campaign) level.
  let advTotal=0;
  const advRecapCards=[];
  if(isNT||isWB){
    advSum.forEach(s=>{
      const nonHT=isNT?(parseInt(s['Neck Tags Placed (Non-HT)'])||0):(parseInt(s['Wobblers Placed (Non-HT)'])||0);
      const ht=isNT?(parseInt(s['Neck Tags Placed (HT)'])||0):0; // Wobblers have no HT column
      const placed=nonHT+ht;
      advTotal+=placed;
      if(placed>0){
        advRecapCards.push({recap:s['Recap Date']||'—',placed,visited:parseInt(s['Stores Visited'])||0,target:parseInt(s['Target Goal'])||0,driveLink:s['Drive File Link']||''});
      }
    });
  }
  const total=intMatches.length+advTotal; // "Total Placed" — a placement count, not a record count
  const hasAdv=advRecapCards.length>0;

  // Combined records for the "All Records" tab. Internal rows are genuine
  // per-store placement records. Advantage is shown as per-campaign summary
  // cards (accurate to the data we actually have), not per-store rows.
  const combined=[];
  intMatches.forEach(r=>{
    const k=Object.keys(r).find(k=>k.includes('Next steps'));
    const note=k?r[k]:'';
    const photos=[...dLinks(r['If Ketone-IQ was placed, add a photo']||''),...dLinks(r['Before and After photos']||'')];
    combined.push({source:'internal',title:cleanLoc(r),sub:getRetailer(r),date:r['Timestamp'],note,photos,tags:getPOS(r),flagged:isFlagged(note),isNew:(r['New or Existing']||'').toLowerCase()==='new',raw:r});
  });
  advRecapCards.forEach(c=>{
    combined.push({source:'advantage',title:'Campaign recap '+c.recap,sub:c.visited+' / '+c.target+' stores visited',date:'',note:c.placed+' '+type+(c.placed!==1?'s':'')+' placed this campaign',photos:[],tags:[],flagged:false,isNew:false,isRecap:true,recap:c.recap,driveLink:c.driveLink});
  });

  // Source filter state
  const sfk='pos_srcf_'+type.replace(/\s/g,'');
  if(!state[sfk])state[sfk]='all';
  const srcFilter=state[sfk];
  const filtered=srcFilter==='all'?combined:combined.filter(r=>r.source===srcFilter);

  // By Retailer — internal only. Advantage placement totals are reported at
  // the campaign level in this data set, not broken out per retailer chain,
  // so we don't fabricate a chain-level breakdown for them here.
  const retMap={};
  intMatches.forEach(r=>{const n=getRetailer(r);if(!retMap[n])retMap[n]={count:0};retMap[n].count++;});
  const retList=Object.entries(retMap).sort((a,b)=>b[1].count-a[1].count);

  // Pagination for All Records
  const RPS=12,rpk='posrpg_'+type.replace(/\s/g,'');
  if(!state[rpk])state[rpk]=1;
  const rpg=state[rpk],rtot=filtered.length,rtp=Math.ceil(rtot/RPS),rpaged=filtered.slice((rpg-1)*RPS,rpg*RPS);

  // Icons
  const icons={'Neck Tag':'<svg viewBox="0 0 20 20" fill="currentColor"><path d="M10 2L13 8H17L13 11L15 17L10 14L5 17L7 11L3 8H7L10 2Z"/></svg>','Wobbler':'<svg viewBox="0 0 20 20" fill="currentColor"><circle cx="10" cy="10" r="8"/><circle cx="10" cy="10" r="4" fill="white"/></svg>','Counter Rack':'<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="6" width="16" height="11" rx="2"/><path d="M6 6V4M14 6V4"/></svg>','Window Cling':'<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="2" width="16" height="16" rx="2"/><path d="M7 8H13M7 11H13M7 14H11"/></svg>','Sample':'<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 2H13V8L15 14C15.4 15 14.7 16 13.7 16H6.3C5.3 16 4.6 15 5 14L7 8V2Z"/></svg>','Floor Shipper':'<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="8" width="16" height="10" rx="2"/><path d="M2 12H18M7 8V5H13V8"/></svg>'};

  // Build header
  var html='<div class="detail-hd"><button class="back-btn" onclick="navBack()"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 2L4 7L9 12"/></svg>Back</button>'
    +'<div class="pos-drill-hd"><div class="pos-drill-icon" style="background:'+color+'1a;color:'+color+'">'+(icons[type]||'')+'</div>'
    +'<div><div class="pos-drill-title">'+esc(type)+'</div><div class="text-muted text-sm" style="margin-top:2px">Total placed across all sources</div></div>'
    +'<div class="pos-drill-total" style="color:'+color+'">'+total+'</div></div></div>';

  // Source filter chips
  html+='<div class="filter-bar" style="margin-bottom:16px">';
  html+='<div class="filter-chip '+(srcFilter==='all'?'active':'')+'" onclick="state[\''+sfk+'\']=\'all\';state[\''+rpk+'\']=1;render()">All ('+combined.length+')</div>';
  html+='<div class="filter-chip '+(srcFilter==='internal'?'active':'')+'" onclick="state[\''+sfk+'\']=\'internal\';state[\''+rpk+'\']=1;render()">Internal Team ('+intMatches.length+')</div>';
  if(hasAdv)html+='<div class="filter-chip '+(srcFilter==='advantage'?'active':'')+'" onclick="state[\''+sfk+'\']=\'advantage\';state[\''+rpk+'\']=1;render()">Advantage campaigns ('+advRecapCards.length+')</div>';
  html+='</div>';
  if(hasAdv)html+='<div class="text-sm text-muted" style="margin:-8px 0 16px">Advantage figures are reported per campaign, not per store — the campaign cards below show total placed for that recap, not individual store placements.</div>';

  // Tabs
  html+='<div id="pos-tabs"><div class="tab-bar">'
    +'<button class="tab-btn active" data-tab="records" onclick="switchTab(\'pos-tabs\',\'records\')">All Records</button>'
    +'<button class="tab-btn" data-tab="retailer" onclick="switchTab(\'pos-tabs\',\'retailer\')">By Retailer</button>'
    +'</div>';

  // ALL RECORDS TAB
  html+='<div class="tab-pane active" data-tab="records">';
  if(!filtered.length){

function initMap(){
  const advRows=fa();const sc={};advRows.filter(r=>r['State']).forEach(r=>{const s=r['State'].toUpperCase().trim();sc[s]=(sc[s]||0)+1;});
  const W=Math.min(460,document.getElementById('map-container')?.offsetWidth||460),H=Math.round(W*0.62);
  const svg=d3.select('#us-map').attr('width',W).attr('height',H).attr('viewBox','0 0 '+W+' '+H);svg.selectAll('*').remove();
  const proj=d3.geoAlbersUsa().scale(W*1.25).translate([W/2,H/2]);const path=d3.geoPath().projection(proj);
  const mx=Math.max(...Object.values(sc),1);const cs=d3.scaleSequential([0,mx],d3.interpolate('#e2e8f0','#5b8def'));
  const tt=document.getElementById('state-tooltip');
  const mapUrls=['https://cdn.jsdelivr.net/npm/us-atlas@3/states-10m.json','https://unpkg.com/us-atlas@3/states-10m.json','https://cdn.jsdelivr.net/npm/us-atlas/states-10m.json','https://raw.githubusercontent.com/topojson/us-atlas/master/us/10m.json'];
  function tryFetch(urls,i){if(i>=urls.length)return Promise.reject(new Error('All CDN sources failed'));return fetch(urls[i]).then(r=>{if(!r.ok)throw new Error(r.status);return r.json();}).catch(()=>tryFetch(urls,i+1));}
  tryFetch(mapUrls,0).then(us=>{
    const states=topojson.feature(us,us.objects.states||us.objects.units||Object.values(us.objects)[0]);const ia=getStateIdMap();
    svg.append('g').selectAll('path').data(states.features).join('path').attr('d',path).attr('fill',d=>{const a=ia[d.id];const c=sc[a]||0;return c?cs(c):'#e2e8f0';}).attr('stroke','#fff').attr('stroke-width',0.5).style('cursor','pointer')
      .on('mousemove',(e,d)=>{const a=ia[d.id]||'';const c=sc[a]||0;tt.style.display='block';tt.style.left=(e.offsetX+10)+'px';tt.style.top=(e.offsetY-28)+'px';tt.textContent=a+': '+c+' visit'+(c!==1?'s':'');})
      .on('mouseleave',()=>tt.style.display='none')
      .on('click',(e,d)=>{const a=ia[d.id];if(a&&sc[a])nav('state-detail',{state:a});});
  }).catch(err=>{console.warn('Map load failed:',err);svg.append('text').attr('x',W/2).attr('y',H/2).attr('text-anchor','middle').attr('fill','#8096b0').attr('font-size','13px').text('Map could not load — check network');svg.append('text').attr('x',W/2).attr('y',H/2+20).attr('text-anchor','middle').attr('fill','#8096b0').attr('font-size','11px').text('State data is shown in the breakdown below');});
}

function saveConfig(){CONFIG.sheetId=document.getElementById('cfg-sid').value.trim()||CONFIG.sheetId;CONFIG.tabs.internal=document.getElementById('cfg-int').value.trim()||CONFIG.tabs.internal;CONFIG.tabs.skyu=document.getElementById('cfg-sky').value.trim()||CONFIG.tabs.skyu;CONFIG.tabs.advStores=document.getElementById('cfg-advs').value.trim()||CONFIG.tabs.advStores;CONFIG.tabs.advSummary=document.getElementById('cfg-advc').value.trim()||CONFIG.tabs.advSummary;showLoading();loadAllData().then(()=>{hideLoading();nav('dashboard');}).catch(e=>{hideLoading();alert('Error: '+e.message);});}
function showLoading(){const el=document.getElementById('loading');el.style.display='flex';el.style.opacity='1';}
function hideLoading(){const el=document.getElementById('loading');el.style.opacity='0';setTimeout(()=>el.style.display='none',300);}
async function init(){
  try{
    await loadAllData();
    hideLoading();
    updateDateLabel();
    updateActive();
    nav('dashboard');
  }catch(e){
    console.error('Data load failed:',e);
    hideLoading();
    const content=document.getElementById('content');
    content.innerHTML=`<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:60vh;gap:16px;text-align:center;padding:24px">
      <div style="width:52px;height:52px;border-radius:12px;background:var(--warn-bg);display:flex;align-items:center;justify-content:center">
        <svg viewBox="0 0 24 24" fill="none" stroke="var(--warn)" stroke-width="2" width="26" height="26"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/></svg>
      </div>
      <div>
        <div style="font-size:17px;font-weight:700;color:var(--text);margin-bottom:6px">Couldn't load data</div>
        <div style="font-size:13px;color:var(--text-3);max-width:360px;line-height:1.6">Make sure the Google Sheet is published or set to "Anyone with the link can view," and that the Sheet ID in Configuration is correct.</div>
      </div>
      <div style="display:flex;gap:10px">
        <button class="btn-primary" onclick="showLoading();loadAllData().then(()=>{hideLoading();updateDateLabel();updateActive();nav('dashboard');}).catch(e=>{hideLoading();document.getElementById('content').innerHTML='<div style=\'padding:24px;color:var(--warn)\'>Still failing: '+e.message+'</div>';})">Retry</button>
        <button class="btn-ghost" onclick="navConfig()">Open Config</button>
      </div>
    </div>`;
    updateActive();
  }
}
init();
</script>
</body>
</html>
