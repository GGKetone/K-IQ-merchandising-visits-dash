<!DOCTYPE html>
<html lang="en">
<head>
<script>(function(){try{if(localStorage.getItem('kiq_theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ketone-IQ · Field Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
:root {
  --navy:#1e293b;--navy-light:#263548;--navy-border:#334155;
  --accent:#6d8df0;--accent-dim:rgba(109,141,240,0.14);
  --brand:#e0483f;
  --bg:#eef2fb;--surface:#ffffff;--surface2:#f1f5fb;
  --text:#232c42;--text-2:#4c5872;--text-3:#77839a;
  --internal:#5b7fa6;--internal-bg:rgba(91,127,166,0.12);
  --skyu:#4a9d94;--skyu-bg:rgba(74,157,148,0.12);
  --advantage:#a4903f;--advantage-bg:rgba(164,144,63,0.12);
  --success:#4f9a70;--success-bg:rgba(79,154,112,0.12);
  --warn:#d17575;--warn-bg:rgba(209,117,117,0.12);
  --border:rgba(255,255,255,0.5);

  /* glass tokens — Tahoe/Liquid Glass recipe: more see-through, saturated blur, specular edge */
  --glass:linear-gradient(135deg, rgba(255,255,255,0.46) 0%, rgba(255,255,255,0.16) 100%);
  --glass-strong:linear-gradient(135deg, rgba(255,255,255,0.66) 0%, rgba(255,255,255,0.32) 100%);
  --glass-soft:linear-gradient(135deg, rgba(255,255,255,0.30) 0%, rgba(255,255,255,0.08) 100%);
  --glass-border:rgba(255,255,255,0.85);
  --glass-border-soft:rgba(255,255,255,0.5);
  --blur:blur(26px) saturate(200%);
  --blur-lg:blur(46px) saturate(200%);

  --shadow-sm:inset 0 1px 1px rgba(255,255,255,0.95),inset 0 0 0 1px rgba(255,255,255,0.12),0 6px 20px rgba(64,79,120,0.10);
  --shadow-md:inset 0 1px 1px rgba(255,255,255,0.95),inset 0 0 0 1px rgba(255,255,255,0.16),0 14px 38px rgba(64,79,120,0.16);
  --shadow-lg:inset 0 1px 1px rgba(255,255,255,0.95),inset 0 0 0 1px rgba(255,255,255,0.2),0 22px 56px rgba(64,79,120,0.20);
  --radius:18px;--radius-sm:13px;
  --sidebar-w:232px;
  --mono:'JetBrains Mono',monospace;
  --sans:'Hanken Grotesk',sans-serif;
  --pos-necktag:#7c6af0;--pos-wobbler:#e07c5a;
  --pos-counter:#5ab0e0;--pos-window:#9878c8;
  --pos-sample:#5bbeaa;--pos-shipper:#c0a030;
  --ease:cubic-bezier(0.16,1,0.3,1);
  --map-base:#e2e8f0;--map-stroke:#ffffff;
  --modal-bg:linear-gradient(160deg, rgba(255,255,255,0.94) 0%, rgba(255,255,255,0.86) 100%);
}

/* DARK MODE */
html[data-theme="dark"]{
  --bg:#12151d;--surface:#1b202b;--surface2:#232a37;
  --text:#e8ecf5;--text-2:#b3bdd1;--text-3:#7c879d;
  --border:rgba(255,255,255,0.12);
  --internal:#7fa4cc;--internal-bg:rgba(127,164,204,0.16);
  --skyu:#5fbcb0;--skyu-bg:rgba(95,188,176,0.16);
  --advantage:#c2ac5c;--advantage-bg:rgba(194,172,92,0.16);
  --success:#6bb98a;--success-bg:rgba(107,185,138,0.16);
  --warn:#e08d8d;--warn-bg:rgba(224,141,141,0.18);
  --glass:linear-gradient(135deg, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0.03) 100%);
  --glass-strong:linear-gradient(135deg, rgba(255,255,255,0.16) 0%, rgba(255,255,255,0.06) 100%);
  --glass-soft:linear-gradient(135deg, rgba(255,255,255,0.06) 0%, rgba(255,255,255,0.02) 100%);
  --glass-border:rgba(255,255,255,0.14);
  --glass-border-soft:rgba(255,255,255,0.09);
  --shadow-sm:inset 0 1px 1px rgba(255,255,255,0.10),inset 0 0 0 1px rgba(255,255,255,0.06),0 6px 20px rgba(0,0,0,0.35);
  --shadow-md:inset 0 1px 1px rgba(255,255,255,0.12),inset 0 0 0 1px rgba(255,255,255,0.08),0 14px 38px rgba(0,0,0,0.45);
  --shadow-lg:inset 0 1px 1px rgba(255,255,255,0.14),inset 0 0 0 1px rgba(255,255,255,0.1),0 22px 56px rgba(0,0,0,0.55);
  --map-base:#2a3140;--map-stroke:#12151d;
  --modal-bg:linear-gradient(160deg, rgba(28,33,44,0.96) 0%, rgba(22,26,35,0.92) 100%);
}
html[data-theme="dark"] body{
  background:
    radial-gradient(circle at 10% 5%, rgba(70,85,140,0.4) 0%, rgba(70,85,140,0) 50%),
    radial-gradient(circle at 90% 95%, rgba(60,72,115,0.35) 0%, rgba(60,72,115,0) 50%),
    linear-gradient(165deg, #141821 0%, #10131a 50%, #13161e 100%);
}

*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;font-family:var(--sans);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;transition:color 0.2s ease;}
body{
  background:
    radial-gradient(circle at 10% 5%, rgba(180,197,232,0.65) 0%, rgba(180,197,232,0) 50%),
    radial-gradient(circle at 90% 95%, rgba(190,206,228,0.6) 0%, rgba(190,206,228,0) 50%),
    linear-gradient(165deg, #e3e9f5 0%, #ebeff8 45%, #e1e8f2 100%);
  background-attachment:fixed;
  transition:background 0.2s ease;
}
#app{display:flex;height:100vh;overflow:hidden;}

/* SIDEBAR */
#sidebar{width:var(--sidebar-w);min-width:var(--sidebar-w);background:var(--glass-strong);backdrop-filter:var(--blur-lg);-webkit-backdrop-filter:var(--blur-lg);border-right:1px solid var(--glass-border);display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden;transition:transform 0.3s var(--ease);z-index:100;}
.sb-brand{padding:22px 18px 18px;border-bottom:1px solid var(--glass-border-soft);}
.sb-logo{display:flex;align-items:center;gap:10px;}
.sb-logo-mark{width:28px;height:28px;background:var(--brand);border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 4px 12px rgba(224,72,63,0.4);}
.sb-brand-name{font-size:14px;font-weight:700;letter-spacing:0.02em;color:var(--text);}
.sb-brand-sub{font-size:11px;color:var(--text-3);font-family:var(--mono);margin-top:1px;}
.sb-section{padding:14px 10px 4px;}
.sb-section-label{font-size:10px;font-weight:600;letter-spacing:0.12em;color:var(--text-3);text-transform:uppercase;padding:0 10px;margin-bottom:6px;}
.sb-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;cursor:pointer;font-size:13px;font-weight:500;color:var(--text-2);transition:background 0.15s,color 0.15s;user-select:none;}
.sb-item:hover{background:rgba(255,255,255,0.55);color:var(--text);}
.sb-item.active{background:rgba(255,255,255,0.85);color:var(--accent);box-shadow:var(--shadow-sm);}
.sb-item.active .sb-icon svg{opacity:1;color:var(--accent);}
.sb-icon{width:18px;height:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.sb-icon svg{width:15px;height:15px;opacity:0.6;transition:opacity 0.15s;}
.sb-item:hover .sb-icon svg,.sb-item.active .sb-icon svg{opacity:1;}

/* MAIN */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
#topbar{height:58px;min-height:58px;background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border-bottom:1px solid var(--glass-border-soft);display:flex;align-items:center;gap:14px;padding:0 20px;}
#content{flex:1;overflow-y:auto;padding:24px;}
#content>.page{animation:pageIn 0.2s var(--ease);max-width:1600px;margin:0 auto;}
@keyframes pageIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

/* HAMBURGER */
#hamburger{display:none;background:none;border:none;cursor:pointer;color:var(--text-2);padding:4px;border-radius:6px;transition:background 0.15s;}
#hamburger:hover{background:rgba(255,255,255,0.5);}

/* THEME TOGGLE */
#theme-toggle{width:34px;height:34px;flex-shrink:0;border-radius:10px;background:rgba(255,255,255,0.4);border:1px solid var(--glass-border);cursor:pointer;color:var(--text-2);display:flex;align-items:center;justify-content:center;transition:background 0.15s,color 0.15s;}
#theme-toggle:hover{background:rgba(255,255,255,0.7);color:var(--accent);}
#theme-toggle svg{width:16px;height:16px;}

/* SEARCH */
#search-wrap{flex:1;max-width:400px;position:relative;}
#search-input{width:100%;padding:8px 12px 8px 36px;border:1px solid var(--glass-border);border-radius:11px;font-family:var(--sans);font-size:13px;background:rgba(255,255,255,0.45);color:var(--text);outline:none;transition:border-color 0.2s,background 0.2s;}
#search-input:focus{border-color:var(--accent);background:rgba(255,255,255,0.85);}
#search-input::placeholder{color:var(--text-3);}
#search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text-3);pointer-events:none;}
#search-icon svg{width:14px;height:14px;}
#search-results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--glass-strong);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--glass-border);border-radius:var(--radius-sm);box-shadow:var(--shadow-lg);max-height:320px;overflow-y:auto;z-index:200;display:none;}
#search-results.open{display:block;}
.sr-item{padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--glass-border-soft);display:flex;align-items:flex-start;gap:10px;transition:background 0.12s;}
.sr-item:last-child{border-bottom:none;}
.sr-item:hover{background:rgba(255,255,255,0.5);}
.sr-item-body{flex:1;min-width:0;}
.sr-item-title{font-weight:600;font-size:13px;}
.sr-item-sub{font-size:12px;color:var(--text-3);}

/* DATE BAR */
#datebar{display:flex;align-items:center;gap:10px;background:var(--glass-soft);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border-bottom:1px solid var(--glass-border-soft);padding:9px 20px;font-size:13px;}
#datebar label{color:var(--text-2);font-weight:500;font-size:12px;}
#datebar input[type="date"]{padding:5px 10px;border:1px solid var(--glass-border);border-radius:8px;font-family:var(--sans);font-size:12px;color:var(--text);background:rgba(255,255,255,0.5);outline:none;transition:border-color 0.2s;}
#datebar input:focus{border-color:var(--accent);}
#btn-alltime{padding:5px 14px;border:1px solid var(--glass-border);border-radius:8px;background:rgba(255,255,255,0.4);font-family:var(--sans);font-size:12px;font-weight:500;color:var(--text-2);cursor:pointer;transition:all 0.15s;}
#btn-alltime:hover{border-color:var(--accent);color:var(--accent);background:rgba(255,255,255,0.7);}
.date-range-label{color:var(--text-3);font-size:11px;font-family:var(--mono);}

/* CARDS */
.card{background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--glass-border);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow-sm);transition:box-shadow 0.2s var(--ease),transform 0.2s var(--ease),background 0.2s;}
.card-lift:hover{box-shadow:var(--shadow-md);transform:translateY(-2px);background:var(--glass-strong);}
.card-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-3);margin-bottom:6px;}
.card-value{font-size:28px;font-weight:700;font-family:var(--mono);color:var(--text);line-height:1;}
.card-sub{font-size:11px;color:var(--text-3);margin-top:4px;}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
.grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;}
.grid-6{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;}
.hero-stat{text-align:center;cursor:default;}
.hero-stat .card-value{font-size:34px;}

/* POS CARDS */
.pos-card{background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--glass-border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow-sm);border-top:3px solid var(--pos-c);cursor:pointer;transition:box-shadow 0.2s var(--ease),transform 0.2s var(--ease),background 0.2s;}
.pos-card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px);background:var(--glass-strong);}
.pos-card .card-value{font-size:24px;color:var(--pos-c);}
.pos-card .card-label{color:var(--pos-c);opacity:0.9;}
.pos-necktag{--pos-c:var(--pos-necktag);}
.pos-wobbler{--pos-c:var(--pos-wobbler);}
.pos-counter{--pos-c:var(--pos-counter);}
.pos-window{--pos-c:var(--pos-window);}
.pos-sample{--pos-c:var(--pos-sample);}
.pos-shipper{--pos-c:var(--pos-shipper);}

/* SECTION */
.section-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.section-title{font-size:15px;font-weight:700;}
.section-sub{font-size:12px;color:var(--text-3);}
.section-gap{margin-top:28px;}

/* BADGES */
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600;font-family:var(--mono);}
.badge-internal{background:var(--internal-bg);color:var(--internal);}
.badge-skyu{background:var(--skyu-bg);color:var(--skyu);}
.badge-advantage{background:var(--advantage-bg);color:var(--advantage);}
.badge-new{background:var(--success-bg);color:var(--success);}
.badge-existing{background:var(--surface2);color:var(--text-3);}
.badge-flagged{background:var(--warn-bg);color:var(--warn);}
.badge-done{background:var(--success-bg);color:var(--success);}

/* POS TAGS */
.pos-tag{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600;}
.pos-tag svg{width:10px;height:10px;}
.pos-tag-necktag{background:rgba(124,106,240,0.1);color:var(--pos-necktag);}
.pos-tag-wobbler{background:rgba(224,124,90,0.1);color:var(--pos-wobbler);}
.pos-tag-counter{background:rgba(90,176,224,0.1);color:var(--pos-counter);}
.pos-tag-window{background:rgba(152,120,200,0.1);color:var(--pos-window);}
.pos-tag-sample{background:rgba(91,190,170,0.1);color:var(--pos-sample);}
.pos-tag-shipper{background:rgba(192,160,48,0.1);color:var(--pos-shipper);}

/* TABS */
.tab-bar{display:flex;gap:2px;border-bottom:2px solid var(--border);margin-bottom:20px;}
.tab-btn{padding:9px 16px;font-size:13px;font-weight:600;color:var(--text-3);background:none;border:none;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:color 0.15s,border-color 0.15s;font-family:var(--sans);}
.tab-btn:hover{color:var(--text-2);}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent);}
.tab-pane{display:none;}
.tab-pane.active{display:block;animation:fadeIn 0.15s ease;}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}

/* ACTION CARDS */
.action-card{background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--glass-border);border-radius:var(--radius);padding:18px;cursor:pointer;transition:box-shadow 0.2s var(--ease),transform 0.2s var(--ease),background 0.2s;box-shadow:var(--shadow-sm);}
.action-card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px);background:var(--glass-strong);}
.action-icon{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;margin-bottom:10px;}
.action-icon svg{width:18px;height:18px;}
.action-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.07em;color:var(--text-3);margin-bottom:4px;}
.action-count{font-size:28px;font-weight:700;font-family:var(--mono);}
.ac-oos .action-icon{background:var(--warn-bg);color:var(--warn);}
.ac-oos .action-count{color:var(--warn);}
.ac-low .action-icon{background:rgba(192,144,64,0.12);color:#c09040;}
.ac-low .action-count{color:#c09040;}
.ac-reorder .action-icon{background:var(--accent-dim);color:var(--accent);}
.ac-reorder .action-count{color:var(--accent);}
.ac-other .action-icon{background:var(--skyu-bg);color:var(--skyu);}
.ac-other .action-count{color:var(--skyu);}

/* STREAM */
.stream-item{display:flex;align-items:flex-start;gap:12px;padding:11px 0;border-bottom:1px solid var(--border);}
.stream-item:last-child{border-bottom:none;}
.stream-dot{width:7px;height:7px;border-radius:50%;margin-top:6px;flex-shrink:0;}
.stream-dot-internal{background:var(--internal);}
.stream-dot-skyu{background:var(--skyu);}
.stream-dot-advantage{background:var(--advantage);}
.stream-body{flex:1;min-width:0;}
.stream-title{font-weight:600;font-size:13px;}
.stream-note{font-size:12px;color:var(--text-2);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.stream-meta{font-size:11px;color:var(--text-3);font-family:var(--mono);margin-top:2px;}

/* LISTS */
.list-card{background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--glass-border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-sm);}
.list-item{display:flex;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid var(--glass-border-soft);cursor:pointer;transition:background 0.12s;}
.list-item:last-child{border-bottom:none;}
.list-item:hover{background:rgba(255,255,255,0.45);}
.list-item-main{flex:1;min-width:0;}
.list-item-title{font-weight:600;font-size:13px;}
.list-item-sub{font-size:12px;color:var(--text-3);margin-top:1px;}
.list-item-right{text-align:right;flex-shrink:0;}
.list-count{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--accent);}
.list-date{font-family:var(--mono);font-size:11px;color:var(--text-3);}
.list-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.list-icon svg{width:15px;height:15px;}

/* DETAIL */
.detail-hd{margin-bottom:24px;}
.back-btn{display:inline-flex;align-items:center;gap:7px;padding:7px 16px;border-radius:99px;background:var(--accent);color:#fff;font-size:13px;font-weight:600;cursor:pointer;border:none;font-family:var(--sans);box-shadow:0 4px 14px rgba(109,141,240,0.32);transition:background 0.15s,box-shadow 0.15s,transform 0.15s;margin-bottom:16px;}
.back-btn:hover{background:#5a7ee0;box-shadow:0 6px 18px rgba(109,141,240,0.42);transform:translateY(-1px);}
.back-btn svg{width:14px;height:14px;}
.detail-title{font-size:22px;font-weight:700;}
.detail-sub{font-size:13px;color:var(--text-3);margin-top:4px;}

/* RECORD DETAIL MODAL */
#record-modal-overlay{position:fixed;inset:0;background:rgba(15,20,30,0.4);display:none;align-items:center;justify-content:center;z-index:1500;backdrop-filter:blur(10px);padding:32px;}
#record-modal-overlay.open{display:flex;}
.record-modal{background:var(--modal-bg);backdrop-filter:var(--blur-lg);-webkit-backdrop-filter:var(--blur-lg);border:1px solid var(--glass-border);border-radius:26px;box-shadow:var(--shadow-lg);width:100%;max-width:760px;max-height:88vh;overflow-y:auto;padding:36px 40px;position:relative;animation:modalIn 0.2s var(--ease);}
.record-modal-close{position:absolute;top:18px;right:18px;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,0.55);border:1px solid var(--glass-border);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-2);transition:background 0.15s;font-size:18px;}
.record-modal-close:hover{background:rgba(255,255,255,0.9);}
.record-modal-title{font-size:24px;font-weight:700;padding-right:44px;}
.record-modal-sub{font-size:14px;color:var(--text-2);margin-top:4px;}
.record-modal-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:16px 0;}
.record-photos-label{font-size:13px;font-weight:600;color:var(--text-2);margin-bottom:10px;}
.record-modal .visit-note{font-size:14px;line-height:1.7;color:var(--text);}
.record-modal .visit-meta{color:var(--text-2);}
.record-modal .photo-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;max-width:none;}
.record-modal .photo-thumb{border-radius:12px;}

/* LIST ROW — compact clickable row used by SkyU/Internal/Advantage task & visit lists */
.rec-row{display:flex;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid var(--glass-border-soft);cursor:pointer;transition:background 0.12s;}
.rec-row:last-child{border-bottom:none;}
.rec-row:hover{background:rgba(255,255,255,0.45);}
.rec-row-thumb{width:44px;height:44px;border-radius:9px;object-fit:cover;flex-shrink:0;border:1px solid var(--glass-border);}
.rec-row-main{flex:1;min-width:0;}
.rec-row-title{font-weight:600;font-size:13px;}
.rec-row-sub{font-size:12px;color:var(--text-3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rec-row-right{display:flex;align-items:center;gap:8px;flex-shrink:0;}

/* MODAL DETAIL TEXT (used inside record-modal via buildDetailHtml) */
.visit-date{font-family:var(--mono);font-size:12px;color:var(--text-3);}
.visit-note{font-size:13px;color:var(--text-2);margin-top:8px;line-height:1.6;}
.visit-meta{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px;font-size:12px;color:var(--text-3);}

/* PHOTO GRID — compact square thumbnails, click to enlarge in lightbox */
.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:6px;margin-top:12px;max-width:456px;}
.photo-thumb{width:100%;aspect-ratio:1/1;object-fit:cover;background:var(--surface2);border-radius:8px;border:1px solid var(--glass-border);cursor:pointer;transition:transform 0.15s,box-shadow 0.15s;display:block;}
.photo-thumb:hover{transform:scale(1.06);box-shadow:var(--shadow-sm);}
.photo-more{width:100%;aspect-ratio:1/1;border-radius:8px;border:1px solid var(--glass-border);background:rgba(255,255,255,0.55);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:12px;font-weight:600;color:var(--text-2);cursor:pointer;transition:background 0.15s;}
.photo-more:hover{background:rgba(255,255,255,0.85);}
/* legacy aliases kept so nothing silently breaks */
.visit-photos,.store-photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:6px;margin-top:12px;max-width:456px;}
.visit-photo,.visit-photo-lg,.adv-photo{width:100%;aspect-ratio:1/1;height:auto;object-fit:cover;background:var(--surface2);border-radius:8px;border:1px solid var(--glass-border);cursor:pointer;transition:transform 0.15s;max-width:none;}
.visit-photo:hover,.visit-photo-lg:hover,.adv-photo:hover{transform:scale(1.06);}

/* PROGRESS */
.prog-wrap{height:4px;background:var(--border);border-radius:2px;overflow:hidden;}
.prog-fill{height:100%;border-radius:2px;background:var(--accent);transition:width 0.5s var(--ease);}

/* BAR LIST */
.bar-list-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);cursor:pointer;transition:opacity 0.12s;}
.bar-list-item:last-child{border-bottom:none;}
.bar-list-item:hover{opacity:0.75;}
.bar-list-name{width:160px;font-size:13px;font-weight:500;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bar-list-bar{flex:1;height:5px;background:var(--border);border-radius:3px;overflow:hidden;}
.bar-list-fill{height:100%;border-radius:3px;background:var(--accent);}
.bar-list-count{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--accent);width:36px;text-align:right;flex-shrink:0;}

/* MAP */
#map-container{position:relative;}
#us-map{display:block;}
.state-tooltip{position:absolute;background:var(--navy);color:#fff;padding:6px 10px;border-radius:6px;font-size:12px;pointer-events:none;display:none;z-index:10;box-shadow:var(--shadow-md);}

/* CAMPAIGN CARDS */
.campaign-card{background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--glass-border);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow-sm);transition:box-shadow 0.2s var(--ease),transform 0.2s var(--ease),background 0.2s;cursor:pointer;margin-bottom:12px;}
.campaign-card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px);background:var(--glass-strong);}
.cc-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.cc-date{font-size:16px;font-weight:700;font-family:var(--mono);}
.cc-pct{font-size:22px;font-weight:700;color:var(--accent);font-family:var(--mono);}
.cc-meta{display:flex;gap:16px;font-size:12px;color:var(--text-3);flex-wrap:wrap;}
.cc-meta strong{color:var(--text);font-family:var(--mono);}
.cc-pos-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:10px;}
.cc-pos-item{display:flex;align-items:center;gap:6px;font-size:12px;}
.cc-pos-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.cc-pos-label{color:var(--text-3);}
.cc-pos-val{font-family:var(--mono);font-weight:600;color:var(--text);margin-left:auto;}

/* ISSUE CARDS */
.issue-card{background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--glass-border);border-left:3px solid var(--warn);border-radius:var(--radius-sm);padding:14px 16px;margin-bottom:10px;cursor:pointer;transition:box-shadow 0.15s,background 0.15s;box-shadow:var(--shadow-sm);}
.issue-card:hover{box-shadow:var(--shadow-md);background:var(--glass-strong);}
.issue-hd{display:flex;align-items:flex-start;gap:8px;flex-wrap:wrap;margin-bottom:6px;}
.issue-note{font-size:13px;color:var(--text-2);line-height:1.5;}
.issue-meta{font-family:var(--mono);font-size:11px;color:var(--text-3);margin-top:6px;}

/* FILTER CHIPS */
.filter-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
.filter-chip{padding:5px 14px;border-radius:99px;border:1px solid var(--glass-border);font-size:12px;font-weight:500;cursor:pointer;background:rgba(255,255,255,0.4);color:var(--text-2);transition:all 0.15s;}
.filter-chip:hover{border-color:var(--accent);color:var(--accent);background:rgba(255,255,255,0.7);}
.filter-chip.active{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 4px 14px rgba(109,141,240,0.35);}

/* SOURCE TAGS */
.source-tag{font-size:10px;font-weight:700;font-family:var(--mono);padding:2px 7px;border-radius:4px;text-transform:uppercase;letter-spacing:0.04em;}
.source-tag-internal{background:var(--internal-bg);color:var(--internal);}
.source-tag-skyu{background:var(--skyu-bg);color:var(--skyu);}
.source-tag-advantage{background:var(--advantage-bg);color:var(--advantage);}

/* RETAILER TABLE */
.r-table{width:100%;border-collapse:collapse;font-size:12px;}
.r-table th{text-align:left;padding:8px 12px;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-3);border-bottom:1px solid var(--glass-border);}
.r-table td{padding:9px 12px;border-bottom:1px solid var(--glass-border-soft);}
.r-table tr:last-child td{border-bottom:none;}
.r-table tbody tr{cursor:pointer;transition:background 0.12s;}
.r-table tbody tr:hover td{background:rgba(255,255,255,0.45);}
.r-table .rname{font-weight:600;font-size:13px;}
.r-table .num{text-align:right;font-family:var(--mono);font-weight:600;}

/* CONFIG */
.config-field{margin-bottom:16px;}
.config-label{font-size:12px;font-weight:600;color:var(--text-2);margin-bottom:6px;display:block;}
.config-input{width:100%;padding:8px 12px;border:1px solid var(--glass-border);border-radius:9px;font-family:var(--mono);font-size:13px;color:var(--text);background:rgba(255,255,255,0.5);outline:none;transition:border-color 0.15s;}
.config-input:focus{border-color:var(--accent);}
.btn-primary{padding:9px 22px;border-radius:9px;background:var(--accent);color:#fff;border:none;font-family:var(--sans);font-size:13px;font-weight:600;cursor:pointer;transition:background 0.15s,box-shadow 0.15s;}
.btn-primary:hover{background:#5a7ee0;box-shadow:0 6px 16px rgba(109,141,240,0.35);}

/* MODAL */
#modal-overlay{position:fixed;inset:0;background:rgba(40,50,74,0.28);display:none;align-items:center;justify-content:center;z-index:1000;backdrop-filter:blur(6px);}
#modal-overlay.open{display:flex;}
.modal{background:var(--glass-strong);backdrop-filter:var(--blur-lg);-webkit-backdrop-filter:var(--blur-lg);border:1px solid var(--glass-border);border-radius:20px;padding:28px;width:360px;box-shadow:var(--shadow-lg);animation:modalIn 0.2s var(--ease);}
@keyframes modalIn{from{opacity:0;transform:scale(0.95);}to{opacity:1;transform:scale(1);}}
.modal-title{font-size:17px;font-weight:700;margin-bottom:6px;}
.modal-sub{font-size:13px;color:var(--text-3);margin-bottom:20px;}
.modal-input{width:100%;padding:9px 12px;border:1px solid var(--glass-border);border-radius:9px;font-family:var(--sans);font-size:14px;margin-bottom:12px;outline:none;background:rgba(255,255,255,0.5);transition:border-color 0.15s;}
.modal-input:focus{border-color:var(--accent);}
.modal-error{color:var(--warn);font-size:12px;margin-bottom:10px;}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;}
.btn-ghost{padding:7px 16px;border-radius:9px;background:rgba(255,255,255,0.4);border:1px solid var(--glass-border);font-family:var(--sans);font-size:13px;font-weight:500;cursor:pointer;color:var(--text-2);transition:all 0.15s;}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent);background:rgba(255,255,255,0.7);}

/* PAGINATION */
.pagination{display:flex;align-items:center;gap:6px;margin-top:16px;justify-content:center;}
.page-btn{padding:6px 11px;border:1px solid var(--glass-border);border-radius:8px;background:rgba(255,255,255,0.4);font-family:var(--sans);font-size:12px;cursor:pointer;color:var(--text-2);transition:all 0.12s;min-width:34px;text-align:center;}
.page-btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent);background:rgba(255,255,255,0.7);}
.page-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.page-btn:disabled{opacity:0.35;cursor:not-allowed;}

/* EMPTY */
.empty{text-align:center;padding:48px 20px;color:var(--text-3);}
.empty-icon{margin-bottom:12px;opacity:0.4;}
.empty-icon svg{width:32px;height:32px;}
.empty-text{font-size:14px;}

/* LOADING */
#loading{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity 0.3s;}
.spinner{width:34px;height:34px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.65s linear infinite;margin-bottom:16px;}
@keyframes spin{to{transform:rotate(360deg);}}
.load-text{font-size:12px;color:var(--text-3);font-family:var(--mono);}

/* MISC */
.store-photos{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;}
#overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.3);z-index:99;}
#overlay.open{display:block;}
.link{color:var(--accent);text-decoration:none;font-size:12px;}
.link:hover{text-decoration:underline;}
a{color:var(--accent);}
.text-mono{font-family:var(--mono);}
.text-sm{font-size:12px;}
.text-muted{color:var(--text-3);}
.divider{height:1px;background:var(--border);margin:18px 0;}

/* POS DRILL HEADER */
.pos-drill-hd{display:flex;align-items:center;gap:14px;margin-bottom:4px;}
.pos-drill-icon{width:44px;height:44px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.pos-drill-icon svg{width:20px;height:20px;}
.pos-drill-title{font-size:21px;font-weight:700;}
.pos-drill-total{font-size:30px;font-weight:700;font-family:var(--mono);margin-left:auto;}

@media(max-width:768px){
  :root{--sidebar-w:244px;}
  #sidebar{position:fixed;top:0;left:0;height:100vh;transform:translateX(-100%);}
  #sidebar.open{transform:translateX(0);box-shadow:var(--shadow-lg);}
  #hamburger{display:flex;}
  .grid-4,.grid-6{grid-template-columns:repeat(2,1fr);}
  .grid-3{grid-template-columns:repeat(2,1fr);}
  .grid-2{grid-template-columns:1fr;}
  #content{padding:16px;}
  .bar-list-name{width:120px;}
  .record-modal{padding:26px 22px;max-width:100%;}
  .record-modal-title{font-size:20px;}
}
@media(max-width:480px){.grid-4,.grid-3,.grid-6{grid-template-columns:repeat(2,1fr);}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}

      radial-gradient(circle at 10% 5%, rgba(180,197,232,0.4) 0%, rgba(180,197,232,0) 45%),

}
@media(min-width:2200px){

      linear-gradient(165deg, #d7ddea 0%, #dde2ec 45%, #d5dce7 100%);
  }
}

/* LIGHTBOX */
#lightbox{position:fixed;inset:0;background:rgba(15,23,42,0.85);display:none;align-items:center;justify-content:center;z-index:2000;backdrop-filter:blur(6px);cursor:pointer;}
#lightbox.open{display:flex;}
#lightbox img{max-width:90vw;max-height:85vh;object-fit:contain;border-radius:10px;box-shadow:0 12px 40px rgba(0,0,0,0.4);cursor:default;}

#lightbox-hint{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,0.5);font-size:12px;font-family:var(--mono);z-index:2001;}
</style>

// DATA
function sheetUrl(tab){return'https://docs.google.com/spreadsheets/d/'+CONFIG.sheetId+'/gviz/tq?tqx=out:csv&sheet='+encodeURIComponent(tab);}
function parseCSV(text){
  const rows=[];let row=[],cell='',inQ=false;
  for(let i=0;i<text.length;i++){const c=text[i];if(inQ){if(c==='"'&&text[i+1]==='"'){cell+='"';i++;}else if(c==='"'){inQ=false;}else{cell+=c;}}else{if(c==='"'){inQ=true;}else if(c===','){row.push(cell);cell='';}else if(c==='\n'||(c==='\r'&&text[i+1]==='\n')){row.push(cell);rows.push(row);row=[];cell='';if(c==='\r')i++;}else if(c==='\r'){row.push(cell);rows.push(row);row=[];cell='';}else{cell+=c;}}}
  if(cell||row.length){row.push(cell);rows.push(row);}
  if(!rows.length)return[];
  const headers=rows[0].map(h=>h.trim());
  return rows.slice(1).filter(r=>r.some(c=>c.trim())).map(r=>{const obj={};headers.forEach((h,i)=>{obj[h]=(r[i]||'').trim();});return obj;});
}
async function fetchSheet(tab){const res=await fetch(sheetUrl(tab));return parseCSV(await res.text());}
async function loadAllData(){
  const[a,b,c,d]=await Promise.all([fetchSheet(CONFIG.tabs.internal),fetchSheet(CONFIG.tabs.skyu),fetchSheet(CONFIG.tabs.advStores),fetchSheet(CONFIG.tabs.advSummary)]);
  state.data.internal=a;state.data.skyu=b;
  state.data.advStores=dedupeAdvStores(c);state.data.advSummary=d;
}
function dedupeAdvStores(rows){const seen=new Set();return rows.filter(r=>{const k=r['Chain']+'|'+r['Store #']+'|'+r['Visit Date']+'|'+r['Recap Date'];if(seen.has(k))return false;seen.add(k);return true;});}

// DATES
function parseDate(s){if(!s)return null;const d=new Date(s);return isNaN(d)?null:d;}
function fmtDate(d){if(!d)return'';return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});}
function fmtShort(s){const d=parseDate(s);if(!d)return s||'';return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});}
function inRange(s){if(!state.dateFrom&&!state.dateTo)return true;const d=parseDate(s);if(!d)return false;if(state.dateFrom&&d<state.dateFrom)return false;if(state.dateTo&&d>state.dateTo)return false;return true;}
function applyDates(){state.dateFrom=document.getElementById('date-from').value?new Date(document.getElementById('date-from').value+'T00:00:00'):null;state.dateTo=document.getElementById('date-to').value?new Date(document.getElementById('date-to').value+'T23:59:59'):null;updateDateLabel();render();}
function resetDates(){state.dateFrom=null;state.dateTo=null;document.getElementById('date-from').value='';document.getElementById('date-to').value='';updateDateLabel();render();}
function updateDateLabel(){const el=document.getElementById('date-range-label');el.textContent=(state.dateFrom||state.dateTo)?((state.dateFrom?fmtDate(state.dateFrom):'All')+' – '+(state.dateTo?fmtDate(state.dateTo):'Now')):'All time';}
function fi(){return state.data.internal.filter(r=>inRange(r['Timestamp']));}
function fs(){return state.data.skyu.filter(r=>inRange(r['Email Date']));}
function fa(){return state.data.advStores.filter(r=>inRange(r['Visit Date']));}
function fsum(){
  // Filter Advantage summaries by date range using Recap Date field
  if(!state.dateFrom && !state.dateTo) return state.data.advSummary;
  return state.data.advSummary.filter(s=>{
    // Recap Date is like "5/11" or "6/11" — we try to match against visit dates
    // from the store rows for that recap, using the actual visit dates for precision.
    // If any store visit in that recap falls in range, include the summary.
    const recapStores = state.data.advStores.filter(r=>r['Recap Date']===s['Recap Date']);
    if(recapStores.length===0) return true; // no store rows, always include summary
    return recapStores.some(r=>inRange(r['Visit Date']));
  });
}

// POS
const POS_TYPES=['Neck Tag','Wobbler','Counter Rack','Window Cling','Sample','Floor Shipper'];
const POS_COLORS={'Neck Tag':'var(--pos-necktag)','Wobbler':'var(--pos-wobbler)','Counter Rack':'var(--pos-counter)','Window Cling':'var(--pos-window)','Sample':'var(--pos-sample)','Floor Shipper':'var(--pos-shipper)'};
const POS_CLASS={'Neck Tag':'pos-necktag','Wobbler':'pos-wobbler','Counter Rack':'pos-counter','Window Cling':'pos-window','Sample':'pos-sample','Floor Shipper':'pos-shipper'};

function getPOS(r){
  const all=((r['Point of Sale Placed']||'')+(r['Displays sold in']||'')+(r['Whether you brought in any point-of-sale materials']||'')).toLowerCase()+' '+(()=>{const k=Object.keys(r).find(k=>k.includes('Next steps'));return k?(r[k]||'').toLowerCase():''})();
  const t=[];
  if(all.includes('neck hanger')||all.includes('neck tag')||all.includes('necktag'))t.push('Neck Tag');
  if(all.includes('wobbler'))t.push('Wobbler');
  if(all.includes('counter rack'))t.push('Counter Rack');
  if(all.includes('window cling'))t.push('Window Cling');
  if(all.includes('sample'))t.push('Sample');
  if(all.includes('floor shipper')||all.includes(' shipper'))t.push('Floor Shipper');
  return t;
}

function calcPOS(rows){
  const c={};POS_TYPES.forEach(t=>c[t]=0);
  rows.forEach(r=>getPOS(r).forEach(t=>c[t]++));
  return c;
}

function totalPOSAll(){
  const intRows=fi(),advSum=fsum();
  const pos=calcPOS(intRows);
  let total=Object.values(pos).reduce((a,b)=>a+b,0);
  advSum.forEach(s=>{total+=(parseInt(s['Neck Tags Placed (Non-HT)'])||0)+(parseInt(s['Neck Tags Placed (HT)'])||0)+(parseInt(s['Wobblers Placed (Non-HT)'])||0)+(parseInt(s['Wobblers Placed (HT)'])||0);});
  return total;
}

function getRetailer(r){
  // Prefer Account serviced, but reject form artifacts like "yes"/"no"/blanks
  const JUNK=/^(yes|no|n\/a|na|none|\-|\.|true|false)$/i;
  const acct=(r['Account serviced']||'').trim();
  const city=(r['Store Location (City)']||'').trim();
  let n=(!acct||JUNK.test(acct))?city:acct;
  if(!n||JUNK.test(n))n='Unknown';
  if(/sprouts/i.test(n))return'Sprouts';if(/circle\s*k/i.test(n))return'Circle K';
  if(/target/i.test(n))return'Target';if(/vitamin\s*shoppe?/i.test(n))return'Vitamin Shoppe';
  if(/bristol\s*farms/i.test(n))return'Bristol Farms';if(/gelson/i.test(n))return"Gelson's";
  if(/7[\-\s]?eleven/i.test(n))return'7-Eleven';if(/ampm/i.test(n))return'AMPM';
  if(/crossfit/i.test(n))return'CrossFit';
  if(/michael\s*kors/i.test(n))return'Michael Kors';
  if(/liquor/i.test(n))return'Liquor Store';
  return n;
}

function cleanLoc(r){
  const JUNK=/^(yes|no|n\/a|na|none|\-|\.|true|false|\d+)$/i;
  const city=(r['Store Location (City)']||'').trim();
  const acct=(r['Account serviced']||'').trim();
  if(!city||JUNK.test(city)){
    if(acct&&!JUNK.test(acct))return acct;
    return'Unlabeled';
  }
  return city;
}

function calcRetailerPOS(rows){
  const map={};
  rows.forEach(r=>{const name=getRetailer(r);if(!map[name])map[name]={visits:0,rows:[],'Neck Tag':0,'Wobbler':0,'Counter Rack':0,'Window Cling':0,'Sample':0,'Floor Shipper':0};map[name].visits++;map[name].rows.push(r);getPOS(r).forEach(t=>map[name][t]++);});
  return Object.entries(map).sort((a,b)=>b[1].visits-a[1].visits);
}

// ISSUES — all three sources
const ISSUE_CATS=[
  {key:'oos',label:'Out of Stock',patterns:['out of stock','oos'],color:'var(--warn)'},
  {key:'low',label:'Low Inventory',patterns:['no inventory','low inventory','no backstock','no back stock'],color:'#c09040'},
  {key:'reorder',label:'Reorder Requests',patterns:['reorder','order placed','placing an order'],color:'var(--accent)'},
  {key:'other',label:'Other Findings',patterns:['no pricing','missing','price tag','not authorized','shelving'],color:'var(--skyu)'}
];
function catIssue(note){if(!note)return null;const lc=note.toLowerCase();for(const c of ISSUE_CATS){if(c.patterns.some(p=>lc.includes(p)))return c.key;}return null;}
function isFlagged(note){return catIssue(note)!==null;}

function getAllIssues(){
  const issues=[];
  for(const r of fi()){const k=Object.keys(r).find(k=>k.includes('Next steps'));const note=k?r[k]:'';const cat=catIssue(note);if(cat)issues.push({source:'internal',note,cat,store:r['Store Location (City)']||'Unlabeled',account:r['Account serviced']||'',date:r['Timestamp']});}
  for(const r of fs()){const note=r['Comments / Findings']||'';const cat=catIssue(note);if(cat)issues.push({source:'skyu',note,cat,store:skyuCity(r),account:'Circle K',date:r['Email Date']});}
  // Advantage outcomes
  for(const s of fsum()){
    const oos=parseInt(s['OOS'])||0;const nr=parseInt(s['Did Not Receive'])||0;
    if(oos>0)issues.push({source:'advantage',note:oos+' stores out of stock in recap '+s['Recap Date'],cat:'oos',store:'Advantage Recap '+s['Recap Date'],account:'Advantage',date:''});
    if(nr>0)issues.push({source:'advantage',note:nr+' stores did not receive materials in recap '+s['Recap Date'],cat:'low',store:'Advantage Recap '+s['Recap Date'],account:'Advantage',date:''});
  }
  return issues;
}

function skyuCity(r){const m=(r['Source Email Subject']||'').match(/Circle K @ (.+?) task/);return m?m[1].trim():(r['Store']||'Unlabeled');}
function driveThumb(url){if(!url)return null;const m=url.match(/[-\w]{25,}/);if(!m)return null;return'https://drive.google.com/thumbnail?id='+m[0]+'&sz=w800';}
function dLinks(str){if(!str)return[];return str.split(',').map(s=>s.trim()).filter(Boolean).map(driveThumb).filter(Boolean);}
function advPhotos(str){
  if(!str)return[];
  const urls=str.split('|').map(s=>s.trim()).filter(Boolean);
  return urls.map(u=>{
    if(u.includes('thumbnail'))return u;
    const m=u.match(/[-\w]{25,}/);
    if(m)return'https://drive.google.com/thumbnail?id='+m[0]+'&sz=w800';
    return u;
  });
}

function renderPhotoGrid(photos,cap){
  if(!photos||!photos.length)return'';
  cap=cap||6;
  const shown=photos.slice(0,cap);
  const overflow=photos.length-shown.length;
  let html='<div class="photo-grid">';
  html+=shown.map(p=>'<img class="photo-thumb" src="'+esc(p)+'" loading="lazy" onerror="this.style.display=\'none\';" onclick="event.stopPropagation();openLightbox(\''+esc(p)+'\')">').join('');
  if(overflow>0){
    const nextUrl=photos[cap];
    html+='<div class="photo-more" onclick="event.stopPropagation();openLightbox(\''+esc(nextUrl)+'\')">+'+overflow+'</div>';
  }
  html+='</div>';
  return html;
}

function initMap(){

  const W=Math.min(460,document.getElementById('map-container')?.offsetWidth||460),H=Math.round(W*0.62);

  const proj=d3.geoAlbersUsa().scale(W*1.25).translate([W/2,H/2]);const path=d3.geoPath().projection(proj);
  const mx=Math.max(...Object.values(sc),1);
  const cssVars=getComputedStyle(document.documentElement);
  const baseFill=cssVars.getPropertyValue('--map-base').trim()||'#e2e8f0';
  const strokeColor=cssVars.getPropertyValue('--map-stroke').trim()||'#fff';
  const cs=d3.scaleSequential([0,mx],d3.interpolate(baseFill,'#6d8df0'));
  const tt=document.getElementById('state-tooltip');
  svg.append('g').selectAll('path').data(US_STATES_GEO.features).join('path').attr('d',path).attr('fill',d=>{const c=sc[d.id]||0;return c?cs(c):baseFill;}).attr('stroke',strokeColor).attr('stroke-width',0.75).style('cursor','pointer')
    .on('mousemove',(e,d)=>{const c=sc[d.id]||0;tt.style.display='block';tt.style.left=(e.offsetX+10)+'px';tt.style.top=(e.offsetY-28)+'px';tt.textContent=(d.name||d.id)+': '+c+' visit'+(c!==1?'s':'');})

}

  const pag=tp>1?'<div class="pagination"><button class="page-btn" '+(pg===1?'disabled':'')+' onclick="state[\''+pk+'\']='+( pg-1)+';render()">Prev</button>'+Array.from({length:tp},(_,i)=>'<button class="page-btn '+(i+1===pg?'active':'')+'" onclick="state[\''+pk+'\']='+( i+1)+';render()">'+(i+1)+'</button>').join('')+'<button class="page-btn" '+(pg===tp?'disabled':'')+' onclick="state[\''+pk+'\']='+( pg+1)+';render()">Next</button></div>':'';
  return`
<div class="detail-hd">
  <button class="back-btn" onclick="navBack()"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 2L4 7L9 12"/></svg>Back</button>
  <div class="detail-title">${esc(chain)}</div>
  <div class="detail-sub">${tot} store${tot!==1?'s':''} visited</div>
</div>
<div class="grid-2">
  ${paged.map((r,idx)=>{const photos=advPhotos(r['Photos']||'');const cid='acvc'+pg+'_'+idx;
    state.recordCache[cid]=buildDetailHtml({title:chain+(r['Store #']?' #'+esc(r['Store #']):''),sub:esc(r['City']||'')+(r['State']?', '+esc(r['State']):''),date:r['Visit Date']?fmtShort(r['Visit Date']):'',photos});
    return'<div class="card card-lift" style="padding:16px;cursor:pointer" onclick="openRecordModal(\''+cid+'\')"><div style="font-weight:700;font-size:14px">'+esc(chain)+' '+(r['Store #']?'#'+esc(r['Store #']):'')+'</div><div class="text-sm text-muted" style="margin:3px 0 10px">'+esc(r['City']||'')+(r['State']?', '+esc(r['State']):'')+(r['Visit Date']?' · '+fmtShort(r['Visit Date']):'')+'</div>'+(photos.length?renderPhotoGrid(photos):'')+'</div>';}).join('')}
</div>
${pag}${!rows.length?'<div class="empty"><div class="empty-text">No stores for this chain.</div></div>':''}`;
}

function renderStateDetail(params){
  const st=params&&params.state?params.state:'';const rows=fa().filter(r=>(r['State']||'').toUpperCase()===st.toUpperCase());rows.sort((a,b)=>(parseDate(b['Visit Date'])||0)-(parseDate(a['Visit Date'])||0));
  const chains=countByKey(rows.filter(r=>r['Chain']),r=>r['Chain']);const chainList=sortedEntries(chains);
  const SPS=12,spk='stpg_'+st;if(!state[spk])state[spk]=1;
  const pg=state[spk],tot=rows.length,tp=Math.ceil(tot/SPS),paged=rows.slice((pg-1)*SPS,pg*SPS);
  const pag=tp>1?'<div class="pagination">'+(pg>1?'<button class="page-btn" onclick="state[\''+spk+'\']='+( pg-1)+';render()">\u2190 Prev</button>':'')+' <span style="font-size:12px;color:var(--text-3);padding:0 8px">Page '+pg+' of '+tp+' \u00b7 '+tot+' stores</span>'+(pg<tp?'<button class="page-btn" onclick="state[\''+spk+'\']='+( pg+1)+';render()">Next \u2192</button>':'')+'</div>':'';
  const chainSummary=chainList.length?'<div class="list-card" style="margin-bottom:20px">'+chainList.map(([c,n])=>'<div class="list-item" onclick="nav(\'advantage-chain\',{chain:'+JSON.stringify(c).replace(/"/g,'&quot;')+'})"><div class="list-item-main"><div class="list-item-title">'+esc(c)+'</div></div><div class="list-item-right"><div class="list-count">'+n+'</div></div></div>').join('')+'</div>':'';
  const storeCards=paged.map((r,idx)=>{const photos=advPhotos(r['Photos']||'');const cid='sdvc'+pg+'_'+idx;
    const extraLink='<span class="link" style="cursor:pointer;font-weight:600" onclick="closeRecordModal();nav(\'advantage-chain\',{chain:'+JSON.stringify(r['Chain']||'').replace(/"/g,'&quot;')+'})">View all '+esc(r['Chain']||'')+' stores \u2192</span>';
    state.recordCache[cid]=buildDetailHtml({title:(r['Chain']||'')+(r['Store #']?' #'+esc(r['Store #']):''),sub:esc(r['City']||''),date:r['Visit Date']?fmtShort(r['Visit Date']):'',photos,extraLink});
    return'<div class="card card-lift" style="padding:16px;cursor:pointer" onclick="openRecordModal(\''+cid+'\')"><div style="font-weight:700;font-size:14px">'+esc(r['Chain']||'')+' '+(r['Store #']?'#'+esc(r['Store #']):'')+'</div><div class="text-sm text-muted" style="margin:3px 0 10px">'+esc(r['City']||'')+(r['Visit Date']?' \u00b7 '+fmtShort(r['Visit Date']):'')+'</div>'+(photos.length?renderPhotoGrid(photos):'')+'</div>';}).join('');
  return'<div class="detail-hd"><button class="back-btn" onclick="navBack()"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 2L4 7L9 12"/></svg>Back</button><div class="detail-title">'+esc(st)+' Stores</div><div class="detail-sub">'+tot+' store'+(tot!==1?'s':'')+' visited (Advantage)</div></div><div class="section-hd"><div class="section-title">Retailers in '+esc(st)+'</div></div>'+chainSummary+'<div class="section-hd"><div class="section-title">All Stores</div></div><div class="grid-2">'+storeCards+'</div>'+pag+(!rows.length?'<div class="empty"><div class="empty-text">No stores in this state.</div></div>':'');
}

// CHAIN DETAIL
function renderChainDetail(params){
  const chain=params&&params.chain?params.chain:'';
  const rows=fi().filter(r=>getRetailer(r)===chain);
  rows.sort((a,b)=>(parseDate(b['Timestamp'])||0)-(parseDate(a['Timestamp'])||0));
  const nk=rows.length?Object.keys(rows[0]).find(k=>k.includes('Next steps')):null;
  const CPS=15,cpk='cdpg_'+chain.replace(/[^a-z0-9]/gi,'');
  if(!state[cpk])state[cpk]=1;
  const cpg=state[cpk],ctot=rows.length,ctp=Math.ceil(ctot/CPS),cpaged=rows.slice((cpg-1)*CPS,cpg*CPS);
  const cpag=ctp>1?'<div class="pagination">'+(cpg>1?'<button class="page-btn" onclick="state[\''+cpk+'\']='+( cpg-1)+';render()">\u2190 Prev</button>':'')+' <span style="font-size:12px;color:var(--text-3);padding:0 8px">Page '+cpg+' of '+ctp+' \u00b7 '+ctot+' total</span>'+(cpg<ctp?'<button class="page-btn" onclick="state[\''+cpk+'\']='+( cpg+1)+';render()">Next \u2192</button>':'')+'</div>':'';

  const cards=cpaged.map((r,idx)=>{const note=nk?r[nk]:'';const tags=getPOS(r);const flagged=isFlagged(note);const photos=[...dLinks(r['If Ketone-IQ was placed, add a photo']||''),...dLinks(r['Before and After photos']||'')];const cid='ccvc'+cpg+'_'+idx;const loc=cleanLoc(r);
    const tagsHtml=tags.map(t=>posTag(t)).join('');
    const extraLink='<span class="link" style="cursor:pointer;font-weight:600" onclick="closeRecordModal();nav(\'internal-detail\',{loc:'+JSON.stringify(loc).replace(/"/g,'&quot;')+'})">View all visits at this location \u2192</span>';
    state.recordCache[cid]=buildDetailHtml({title:loc,sub:chain,date:fmtShort(r['Timestamp']),badgesHtml:'<span class="badge '+((r['New or Existing']||'').toLowerCase()==='new'?'badge-new':'badge-existing')+'">'+esc(r['New or Existing']||'Existing')+'</span>'+(flagged?'<span class="badge badge-flagged">Flagged</span>':''),tagsHtml,note,photos,extraLink});
    return'<div class="rec-row" onclick="openRecordModal(\''+cid+'\')">'
      +(photos.length?'<img class="rec-row-thumb" src="'+esc(photos[0])+'" loading="lazy" onerror="this.style.display=\'none\'">':'<div class="list-icon" style="background:var(--internal-bg);color:var(--internal)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1" y="5" width="14" height="9" rx="1.5"/><path d="M5 5V3.5C5 2.7 5.7 2 6.5 2H9.5C10.3 2 11 2.7 11 3.5V5"/><path d="M5 9H11"/></svg></div>')
      +'<div class="rec-row-main"><div class="rec-row-title">'+fmtShort(r['Timestamp'])+' \u00b7 '+esc(loc)+'</div><div class="rec-row-sub">'+(photos.length?photos.length+' photo'+(photos.length!==1?'s':'')+' \u00b7 ':'')+(note?esc(note.substring(0,60))+(note.length>60?'\u2026':''):'No notes')+'</div></div>'
      +'<div class="rec-row-right">'+((r['New or Existing']||'').toLowerCase()==='new'?'<span class="badge badge-new">New</span>':'')+(flagged?'<span class="badge badge-flagged">Flagged</span>':'')+'<svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="var(--text-3)" stroke-width="1.6"><path d="M4 2L8 6L4 10"/></svg></div>'
      +'</div>';}).join('');

  return '<div class="detail-hd"><button class="back-btn" onclick="navBack()"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 2L4 7L9 12"/></svg>Back</button><div class="detail-title">'+esc(chain)+'</div><div class="detail-sub">'+ctot+' visit'+(ctot!==1?'s':'')+' \u00b7 Internal Team</div></div><div class="list-card">'+cards+'</div>'+cpag+(!rows.length?'<div class="empty"><div class="empty-text">No visits found.</div></div>':'');
}

// RETAILER DETAIL — all visits for a retailer with a specific POS type
function renderRetailerDetail(params){
  const retailer=params&&params.retailer?params.retailer:'';
  const type=params&&params.type?params.type:'';
  const color=POS_COLORS[type]||'var(--accent)';
  const rows=fi().filter(r=>getRetailer(r)===retailer&&getPOS(r).includes(type));
  rows.sort((a,b)=>(parseDate(b['Timestamp'])||0)-(parseDate(a['Timestamp'])||0));
  const RPS=10,rpk='rdpg_'+retailer.replace(/[^a-z0-9]/gi,'');
  if(!state[rpk])state[rpk]=1;
  const rpg=state[rpk],rtot=rows.length,rtp=Math.ceil(rtot/RPS),rpaged=rows.slice((rpg-1)*RPS,rpg*RPS);
  const rpag=rtp>1?'<div class="pagination">'+(rpg>1?'<button class="page-btn" onclick="state[\''+rpk+'\']='+( rpg-1)+';render()">\u2190 Prev</button>':'')+' <span style="font-size:12px;color:var(--text-3);padding:0 8px">'+rpg+' of '+rtp+' \u00b7 '+rtot+' total</span>'+(rpg<rtp?'<button class="page-btn" onclick="state[\''+rpk+'\']='+( rpg+1)+';render()">Next \u2192</button>':'')+'</div>':'';
  const nk=rows.length?Object.keys(rows[0]).find(k=>k.includes('Next steps')):null;
  return`
<div class="detail-hd">
  <button class="back-btn" onclick="navBack()"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 2L4 7L9 12"/></svg>Back</button>
  <div class="detail-title">${esc(retailer)}</div>
  <div class="detail-sub">${rtot} visit${rtot!==1?'s':''} with ${esc(type)} \u00b7 Internal Team</div>
</div>
<div class="list-card">
${rpaged.map((r,idx)=>{const note=nk?r[nk]:'';const tags=getPOS(r);const flagged=isFlagged(note);const photos=[...dLinks(r['If Ketone-IQ was placed, add a photo']||''),...dLinks(r['Before and After photos']||'')];const cid='rdvc'+rpg+'_'+idx;const loc=r['Store Location (City)']||'Unlabeled';
  const tagsHtml=tags.map(t=>posTag(t)).join('');
  const extraLink='<span class="link" style="cursor:pointer;font-weight:600" onclick="closeRecordModal();nav(\'internal-detail\',{loc:'+JSON.stringify(loc).replace(/"/g,'&quot;')+'})">View all visits at this location \u2192</span>';
  state.recordCache[cid]=buildDetailHtml({title:loc,sub:r['Account serviced']||'',date:fmtShort(r['Timestamp']),badgesHtml:'<span class="badge '+((r['New or Existing']||'').toLowerCase()==='new'?'badge-new':'badge-existing')+'">'+esc(r['New or Existing']||'Existing')+'</span>'+(flagged?'<span class="badge badge-flagged">Flagged</span>':''),tagsHtml,note,photos,extraLink});
  return'<div class="rec-row" onclick="openRecordModal(\''+cid+'\')">'
    +(photos.length?'<img class="rec-row-thumb" src="'+esc(photos[0])+'" loading="lazy" onerror="this.style.display=\'none\'">':'<div class="list-icon" style="background:var(--internal-bg);color:var(--internal)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1" y="5" width="14" height="9" rx="1.5"/><path d="M5 5V3.5C5 2.7 5.7 2 6.5 2H9.5C10.3 2 11 2.7 11 3.5V5"/><path d="M5 9H11"/></svg></div>')
    +'<div class="rec-row-main"><div class="rec-row-title">'+fmtShort(r['Timestamp'])+' \u00b7 '+esc(loc)+'</div><div class="rec-row-sub">'+(photos.length?photos.length+' photo'+(photos.length!==1?'s':'')+' \u00b7 ':'')+(note?esc(note.substring(0,60))+(note.length>60?'\u2026':''):'No notes')+'</div></div>'
    +'<div class="rec-row-right">'+((r['New or Existing']||'').toLowerCase()==='new'?'<span class="badge badge-new">New</span>':'')+(flagged?'<span class="badge badge-flagged">Flagged</span>':'')+'<svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="var(--text-3)" stroke-width="1.6"><path d="M4 2L8 6L4 10"/></svg></div>'
    +'</div>';}).join('')}
</div>
${rpag}
${!rows.length?'<div class="empty"><div class="empty-text">No visits found for this retailer and POS type.</div></div>':''}`;
}


function renderConfig(){
  return`
<div class="section-hd"><div class="section-title" style="font-size:20px">Configuration</div></div>
<div class="card" style="max-width:540px">
  <div class="config-field"><label class="config-label">Google Sheet ID</label><input class="config-input" id="cfg-sid" value="${esc(CONFIG.sheetId)}"></div>
  <div class="config-field"><label class="config-label">Internal Team Tab</label><input class="config-input" id="cfg-int" value="${esc(CONFIG.tabs.internal)}"></div>
  <div class="config-field"><label class="config-label">SkyU Visits Tab</label><input class="config-input" id="cfg-sky" value="${esc(CONFIG.tabs.skyu)}"></div>
  <div class="config-field"><label class="config-label">Advantage Store Visits Tab</label><input class="config-input" id="cfg-advs" value="${esc(CONFIG.tabs.advStores)}"></div>
  <div class="config-field"><label class="config-label">Advantage Campaign Summaries Tab</label><input class="config-input" id="cfg-advc" value="${esc(CONFIG.tabs.advSummary)}"></div>
  <button class="btn-primary" onclick="saveConfig()">Save & Reload</button>
</div>`;
}
function saveConfig(){CONFIG.sheetId=document.getElementById('cfg-sid').value.trim()||CONFIG.sheetId;CONFIG.tabs.internal=document.getElementById('cfg-int').value.trim()||CONFIG.tabs.internal;CONFIG.tabs.skyu=document.getElementById('cfg-sky').value.trim()||CONFIG.tabs.skyu;CONFIG.tabs.advStores=document.getElementById('cfg-advs').value.trim()||CONFIG.tabs.advStores;CONFIG.tabs.advSummary=document.getElementById('cfg-advc').value.trim()||CONFIG.tabs.advSummary;showLoading();loadAllData().then(()=>{hideLoading();nav('dashboard');}).catch(e=>{hideLoading();alert('Error: '+e.message);});}
function showLoading(){const el=document.getElementById('loading');el.style.display='flex';el.style.opacity='1';}
function hideLoading(){const el=document.getElementById('loading');el.style.opacity='0';setTimeout(()=>el.style.display='none',300);}
async function init(){
  updateThemeIcon();
  try{
    await loadAllData();
    hideLoading();
    updateDateLabel();
    updateActive();
    nav('dashboard');
  }catch(e){
    console.error('Data load failed:',e);
    hideLoading();
    const content=document.getElementById('content');
    content.innerHTML=`<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:60vh;gap:16px;text-align:center;padding:24px">
      <div style="width:52px;height:52px;border-radius:12px;background:var(--warn-bg);display:flex;align-items:center;justify-content:center">
        <svg viewBox="0 0 24 24" fill="none" stroke="var(--warn)" stroke-width="2" width="26" height="26"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/></svg>
      </div>
      <div>
        <div style="font-size:17px;font-weight:700;color:var(--text);margin-bottom:6px">Couldn't load data</div>
        <div style="font-size:13px;color:var(--text-3);max-width:360px;line-height:1.6">Make sure the Google Sheet is published or set to "Anyone with the link can view," and that the Sheet ID in Configuration is correct.</div>
      </div>
      <div style="display:flex;gap:10px">
        <button class="btn-primary" onclick="showLoading();loadAllData().then(()=>{hideLoading();updateDateLabel();updateActive();nav('dashboard');}).catch(e=>{hideLoading();document.getElementById('content').innerHTML='<div style=\'padding:24px;color:var(--warn)\'>Still failing: '+e.message+'</div>';})">Retry</button>
        <button class="btn-ghost" onclick="navConfig()">Open Config</button>
      </div>
    </div>`;
    updateActive();
  }
}
init();
</script>
